name: Temporary generator mode sync patch

on:
  push:
    branches:
      - fix/generator-mode-field-sync

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Synchronize Basic and Advanced style fields'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/generator-mode-field-sync
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Patch Generator mode sync
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/routes/generate.tsx')
          s = p.read_text()

          old = '''  const changeGeneratorMode = (mode: "basic" | "advanced" | "revision") => {\n    setRequiredValidationAttempted(false);\n    if (mode === "revision") {\n      setRevisionMode(true);\n      setAdvanced(true);\n      setResult(null);\n      setRevisionMeta(null);\n      setQuality(null);\n      void navigate({\n        to: "/generate",\n        search: {\n          mode: "revision",\n          project: revisionProjectId || undefined,\n          base: revisionBasePromptId || undefined,\n        },\n        replace: true,\n      });\n      return;\n    }\n\n    setRevisionMode(false);\n    setAdvanced(mode === "advanced");\n    setRevisionProjectId("");\n    setRevisionBasePromptId("");\n    setRevisionRequest("");\n    setRevisionMeta(null);\n    void navigate({ to: "/generate", search: {}, replace: true });\n  };'''

          new = '''  const syncSharedFieldsForMode = (nextAdvanced: boolean) => {\n    if (nextAdvanced) {\n      const primaryGenre = genres[0];\n      if (primaryGenre && primaryGenre !== CUSTOM && ADVANCED_STYLES.includes(primaryGenre)) {\n        setShowStyleTags(true);\n      }\n\n      const primaryMood = moods[0];\n      if (primaryMood && primaryMood !== CUSTOM && ADVANCED_MOOD_VALUES.includes(primaryMood)) {\n        setShowMoodTags(true);\n      }\n      return;\n    }\n\n    if (customGenre.trim()) {\n      setGenres((prev) => [CUSTOM, ...prev.filter((value) => value !== CUSTOM)]);\n    } else {\n      setGenres((prev) => {\n        const basicMatch = prev.find(\n          (value) => value !== CUSTOM && GENRE_OPTIONS.includes(value),\n        );\n        if (!basicMatch) return prev;\n        return [\n          basicMatch,\n          ...prev.filter((value) => value !== basicMatch && value !== CUSTOM),\n        ];\n      });\n    }\n\n    if (customMood.trim()) {\n      setMoods((prev) => [CUSTOM, ...prev.filter((value) => value !== CUSTOM)]);\n    } else {\n      setMoods((prev) => {\n        const basicMatch = prev.find(\n          (value) => value !== CUSTOM && MOOD_OPTIONS.includes(value),\n        );\n        if (!basicMatch) return prev;\n        return [\n          basicMatch,\n          ...prev.filter((value) => value !== basicMatch && value !== CUSTOM),\n        ];\n      });\n    }\n  };\n\n  const changeGeneratorMode = (mode: "basic" | "advanced" | "revision") => {\n    setRequiredValidationAttempted(false);\n    if (mode === "revision") {\n      setRevisionMode(true);\n      setAdvanced(true);\n      setResult(null);\n      setRevisionMeta(null);\n      setQuality(null);\n      void navigate({\n        to: "/generate",\n        search: {\n          mode: "revision",\n          project: revisionProjectId || undefined,\n          base: revisionBasePromptId || undefined,\n        },\n        replace: true,\n      });\n      return;\n    }\n\n    const nextAdvanced = mode === "advanced";\n    syncSharedFieldsForMode(nextAdvanced);\n    setRevisionMode(false);\n    setAdvanced(nextAdvanced);\n    setRevisionProjectId("");\n    setRevisionBasePromptId("");\n    setRevisionRequest("");\n    setRevisionMeta(null);\n    void navigate({ to: "/generate", search: {}, replace: true });\n  };'''

          if s.count(old) != 1:
              raise SystemExit(f'Expected mode block once, found {s.count(old)}')
          s = s.replace(old, new)

          old = '''                  onChange={(e) => pickPrimary(setGenres)(e.target.value)}'''
          new = '''                  onChange={(e) => {\n                    const value = e.target.value;\n                    pickPrimary(setGenres)(value);\n                    if (value !== CUSTOM) setCustomGenre("");\n                  }}'''
          if s.count(old) != 1:
              raise SystemExit(f'Expected Basic genre select handler once, found {s.count(old)}')
          s = s.replace(old, new)

          old = '''                    onChange={(e) => pickPrimary(setMoods)(e.target.value)}'''
          new = '''                    onChange={(e) => {\n                      const value = e.target.value;\n                      pickPrimary(setMoods)(value);\n                      if (value !== CUSTOM) setCustomMood("");\n                    }}'''
          if s.count(old) != 1:
              raise SystemExit(f'Expected Basic mood select handler once, found {s.count(old)}')
          s = s.replace(old, new)

          p.write_text(s)
          PY
      - run: bunx prettier --write src/routes/generate.tsx
      - run: |
          git config user.name "PromptBeats CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/routes/generate.tsx
          git diff --cached --check
          git commit -m "Synchronize Basic and Advanced style fields"
          git push origin HEAD:fix/generator-mode-field-sync
