name: Settings format once

on:
  push:
    branches:
      - feat/settings-preferences-redesign
    paths:
      - .github/workflows/settings-format-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/settings-preferences-redesign
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Format Settings implementation
        run: |
          bunx prettier --write \
            src/components/promptbeats/SettingsPanel.tsx \
            src/routes/generate.tsx \
            src/lib/song-arrangement-ui.test.ts \
            src/components/promptbeats/StudioModal.tsx \
            src/routes/library.tsx \
            src/components/promptbeats/ExportControl.tsx \
            src/components/promptbeats/LanguagePicker.tsx \
            src/lib/account-preferences.ts \
            src/lib/library-tabs.ts \
            src/lib/account-preferences-settings.test.ts
      - name: Commit formatting
        run: |
          git config user.name "PromptBeats CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/promptbeats/SettingsPanel.tsx src/routes/generate.tsx src/lib/song-arrangement-ui.test.ts src/components/promptbeats/StudioModal.tsx src/routes/library.tsx src/components/promptbeats/ExportControl.tsx src/components/promptbeats/LanguagePicker.tsx src/lib/account-preferences.ts src/lib/library-tabs.ts src/lib/account-preferences-settings.test.ts
          git commit -m "Format Settings preference implementation"
          git push origin HEAD:feat/settings-preferences-redesign
