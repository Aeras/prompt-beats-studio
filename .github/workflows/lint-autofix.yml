name: Temporary lint autofix

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  autofix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply safe ESLint autofixes
        run: |
          bunx eslint . --fix || true
          git diff --binary > lint-autofix.patch
          git diff --name-only > lint-autofix-files.txt
          bun run lint > lint-after-autofix.log 2>&1 || true

      - name: Upload autofix patch
        uses: actions/upload-artifact@v4
        with:
          name: lint-autofix-output
          path: |
            lint-autofix.patch
            lint-autofix-files.txt
            lint-after-autofix.log
          retention-days: 1
