name: Song Universe library badge

on:
  push:
    branches: [song-universe-step2]

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.head_commit.message != 'Apply Song Universe project badge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: song-universe-step2
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: python3 scripts/song-universe-library-badge.py
      - run: bunx prettier --write src/routes/library.tsx src/components/promptbeats/SongUniverseProjectBadge.tsx src/lib/song-universe-membership.functions.ts
      - run: bun run build
      - run: bunx prettier --write src/routeTree.gen.ts
      - name: Commit badge integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src
          if ! git diff --cached --quiet; then
            git commit -m 'Apply Song Universe project badge'
            git push origin song-universe-step2
          fi
