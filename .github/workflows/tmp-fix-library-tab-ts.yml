name: Temporary Library Tab Type Fix

on:
  push:
    branches:
      - fix/library-tab-persistence-mobile-nav

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/library-tab-persistence-mobile-nav
          fetch-depth: 0
      - name: Patch validateSearch exact optional property handling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/routes/library.tsx')
          text = path.read_text()
          old = '''  validateSearch: (search: Record<string, unknown>): LibrarySearch => ({\n    tab: parseLibraryTab(search["tab"]),\n  }),'''
          new = '''  validateSearch: (search: Record<string, unknown>): LibrarySearch => {\n    const tab = parseLibraryTab(search["tab"]);\n    return tab ? { tab } : {};\n  },'''
          if old not in text:
              raise SystemExit('Target block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/library.tsx
          git commit -m "Fix optional Library tab search typing"
          git push origin HEAD:fix/library-tab-persistence-mobile-nav
