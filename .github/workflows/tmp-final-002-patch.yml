name: Temporary FINAL-002 patch

on:
  push:
    branches:
      - fix/final-002-atomic-track-edit

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-002-atomic-track-edit
      - uses: oven-sh/setup-bun@v2
      - name: Patch track edit call
        run: |
          echo '' | base64 -d > /tmp/final002.py
          python /tmp/final002.py
          bunx prettier --write src/lib/tracks.functions.ts src/lib/final-002-atomic-track-edit.test.ts
      - name: Commit patch if needed
        run: |
          if git diff --quiet; then
            echo "No patch changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/tracks.functions.ts src/lib/final-002-atomic-track-edit.test.ts
          git commit -m "Make owner track edits atomic"
          git push origin HEAD:fix/final-002-atomic-track-edit
