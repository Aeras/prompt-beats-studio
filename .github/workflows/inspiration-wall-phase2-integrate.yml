name: Inspiration Wall Phase 2 Integrate

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspiration-wall-phase2-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Patch Phase 2 integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/routes/inspiration-wall.tsx')
          s = p.read_text()
          s = s.replace(
            '  useEffect(() => {\n    if (!selectedWallId && walls.data?.walls?.length) setSelectedWallId(walls.data.walls[0].id);\n  }, [selectedWallId, walls.data?.walls]);',
            '  useEffect(() => {\n    const firstWall = walls.data?.walls?.[0];\n    if (!selectedWallId && firstWall) setSelectedWallId(firstWall.id);\n  }, [selectedWallId, walls.data?.walls]);'
          )
          s = s.replace('if (!access.loading && !access.allowed)', 'if (!access.isLoading && !access.allowed)')
          s = s.replace(
            '  useEffect(() => () => saveTimer.current && clearTimeout(saveTimer.current), []);',
            '  useEffect(\n    () => () => {\n      if (saveTimer.current) clearTimeout(saveTimer.current);\n    },\n    [],\n  );'
          )
          p.write_text(s)

          p = Path('src/components/promptbeats/Sidebar.tsx')
          s = p.read_text()
          s = s.replace('  Library,\n', '  Library,\n  Lightbulb,\n')
          s = s.replace('  { id: "lyricsReview", labelKey: null, icon: TextSearch },\n  { id: "library"', '  { id: "lyricsReview", labelKey: null, icon: TextSearch },\n  { id: "inspirationWall", labelKey: null, icon: Lightbulb },\n  { id: "library"')
          s = s.replace('  lyricsReview: "/lyrics-review",\n  library:', '  lyricsReview: "/lyrics-review",\n  inspirationWall: "/inspiration-wall",\n  library:')
          s = s.replace('  const lyricsReviewAccess = useFeatureAccess("lyrics_review");\n', '  const lyricsReviewAccess = useFeatureAccess("lyrics_review");\n  const inspirationWallAccess = useFeatureAccess("inspiration_wall");\n')
          s = s.replace('(item.id !== "lyricsReview" || lyricsReviewAccess.allowed) &&\n            (!STAFF_ONLY', '(item.id !== "lyricsReview" || lyricsReviewAccess.allowed) &&\n            (item.id !== "inspirationWall" || inspirationWallAccess.allowed) &&\n            (!STAFF_ONLY')
          s = s.replace('                : item.id === "lyricsReview"\n                  ? "Lyrics Review"\n                  : item.id;', '                : item.id === "lyricsReview"\n                  ? "Lyrics Review"\n                  : item.id === "inspirationWall"\n                    ? "Inspiration Wall"\n                    : item.id;')
          p.write_text(s)

          p = Path('src/components/promptbeats/AppShell.tsx')
          s = p.read_text()
          s = s.replace('  lyricsReview: "/lyrics-review",\n  library:', '  lyricsReview: "/lyrics-review",\n  inspirationWall: "/inspiration-wall",\n  library:')
          s = s.replace('  id: Exclude<NavId, "musicLab" | "songAnalyzer" | "lyricsReview" | "management">;', '  id: Exclude<NavId, "musicLab" | "songAnalyzer" | "lyricsReview" | "inspirationWall" | "management">;')
          s = s.replace('  if (pathname.startsWith("/lyrics-review")) return "lyricsReview";\n', '  if (pathname.startsWith("/lyrics-review")) return "lyricsReview";\n  if (pathname.startsWith("/inspiration-wall")) return "inspirationWall";\n')
          p.write_text(s)
          PY
          bunx prettier --write src/components/promptbeats/Sidebar.tsx src/components/promptbeats/AppShell.tsx src/routes/inspiration-wall.tsx src/lib/inspiration-wall-image.ts src/lib/inspiration-wall-phase2.test.ts
      - name: Phase 2 tests
        run: bun test src/lib/inspiration-wall.test.ts src/lib/inspiration-wall-phase2.test.ts src/lib/feature-access-v2.test.ts
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build
      - name: Strict TypeScript
        run: bunx tsc --noEmit --pretty false
      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/promptbeats/Sidebar.tsx src/components/promptbeats/AppShell.tsx src/routes/inspiration-wall.tsx src/lib/inspiration-wall-image.ts src/lib/inspiration-wall-phase2.test.ts
          if git diff --cached --quiet; then
            echo "No integration changes required."
            exit 0
          fi
          git commit -m "Integrate Inspiration Wall Phase 2 navigation"
          git push origin HEAD:main
