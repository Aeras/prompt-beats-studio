name: Temporary Prompt Projects Patch

on:
  push:
    branches:
      - feat/prompt-projects-standalone-workflow

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[prompt-projects patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize patch patterns
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/prompt_projects_patch.py')
          text = path.read_text()
          text = text.replace('search.project!', 'search.project as string')
          text = text.replace('search.base!', 'search.base as string')
          path.write_text(text)
          PY
      - name: Apply patch
        run: python .github/scripts/prompt_projects_patch.py
      - name: Check whitespace
        run: git diff --check
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Implement Prompt and Project workflow improvements [prompt-projects patched]"
          git push
