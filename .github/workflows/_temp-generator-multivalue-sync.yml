name: Temporary generator multi-value sync patch

on:
  push:
    branches:
      - fix/generator-mode-multivalue-sync

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Preserve multiple Advanced style values in Basic mode'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/generator-mode-multivalue-sync
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Patch Generator multi-value sync
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/routes/generate.tsx')
          s = p.read_text()

          old = '''    if (customGenre.trim()) {\n      setGenres((prev) => [CUSTOM, ...prev.filter((value) => value !== CUSTOM)]);\n    } else {\n      setGenres((prev) => {\n        const basicMatch = prev.find((value) => value !== CUSTOM && GENRE_OPTIONS.includes(value));\n        if (!basicMatch) return prev;\n        return [basicMatch, ...prev.filter((value) => value !== basicMatch && value !== CUSTOM)];\n      });\n    }\n\n    if (customMood.trim()) {\n      setMoods((prev) => [CUSTOM, ...prev.filter((value) => value !== CUSTOM)]);\n    } else {\n      setMoods((prev) => {\n        const basicMatch = prev.find((value) => value !== CUSTOM && MOOD_OPTIONS.includes(value));\n        if (!basicMatch) return prev;\n        return [basicMatch, ...prev.filter((value) => value !== basicMatch && value !== CUSTOM)];\n      });\n    }'''

          new = '''    const selectedGenres = genres.filter((value) => value !== CUSTOM);\n    const mergedGenreText = mergeValues(selectedGenres, customGenre).join(", ");\n    if (customGenre.trim() || selectedGenres.length > 1) {\n      setCustomGenre(mergedGenreText);\n      setGenres([CUSTOM]);\n    } else if (selectedGenres.length === 1) {\n      const [onlyGenre] = selectedGenres;\n      if (GENRE_OPTIONS.includes(onlyGenre)) {\n        setGenres([onlyGenre]);\n      } else {\n        setCustomGenre(onlyGenre);\n        setGenres([CUSTOM]);\n      }\n    }\n\n    const selectedMoods = moods.filter((value) => value !== CUSTOM);\n    const mergedMoodText = mergeValues(selectedMoods, customMood).join(", ");\n    if (customMood.trim() || selectedMoods.length > 1) {\n      setCustomMood(mergedMoodText);\n      setMoods([CUSTOM]);\n    } else if (selectedMoods.length === 1) {\n      const [onlyMood] = selectedMoods;\n      if (MOOD_OPTIONS.includes(onlyMood)) {\n        setMoods([onlyMood]);\n      } else {\n        setCustomMood(onlyMood);\n        setMoods([CUSTOM]);\n      }\n    }'''

          if s.count(old) != 1:
              raise SystemExit(f'Expected sync block once, found {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY
      - run: bunx prettier --write src/routes/generate.tsx
      - run: |
          git config user.name "PromptBeats CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/routes/generate.tsx
          git diff --cached --check
          git commit -m "Preserve multiple Advanced style values in Basic mode"
          git push origin HEAD:fix/generator-mode-multivalue-sync
