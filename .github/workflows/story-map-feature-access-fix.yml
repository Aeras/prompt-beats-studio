name: Story Map feature access test fix

on:
  push:
    branches: [story-map-step1]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Apply Story Map feature access test fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: story-map-step1
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Apply fix
        run: |
          python3 scripts/story-map-feature-access-test-fix.py
          bunx prettier --write src/lib/feature-access-v2.test.ts
          bun test src/lib/feature-access-v2.test.ts
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/feature-access-v2.test.ts
          git commit -m 'Apply Story Map feature access test fix' || exit 0
          git push origin story-map-step1
