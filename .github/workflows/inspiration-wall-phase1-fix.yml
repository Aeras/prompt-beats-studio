name: Inspiration Wall Phase 1 Test Update

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspiration-wall-phase1-fix.yml

permissions:
  contents: write

jobs:
  update-feature-access-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Update canonical feature count
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/lib/feature-access-v2.test.ts')
          s = p.read_text()
          s = s.replace('  "song_setup_assistant",\n  "export_center",', '  "song_setup_assistant",\n  "inspiration_wall",\n  "export_center",', 1)
          s = s.replace('describe("Feature Access V2 — 17 features"', 'describe("Feature Access V2 — 18 features"', 1)
          s = s.replace('test("canonical TypeScript registry contains exactly 17 unique feature keys"', 'test("canonical TypeScript registry contains exactly 18 unique feature keys"', 1)
          s = s.replace('expect(new Set(keys).size).toBe(17);', 'expect(new Set(keys).size).toBe(18);', 1)
          s = s.replace('      "song_setup_assistant",\n      "lyrics_review",', '      "song_setup_assistant",\n      "inspiration_wall",\n      "lyrics_review",', 1)
          p.write_text(s)
          PY
      - name: Verify Feature Access V2
        run: bun test src/lib/feature-access-v2.test.ts
      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/feature-access-v2.test.ts
          git commit -m "Update Feature Access registry for Inspiration Wall"
          git push origin HEAD:main
