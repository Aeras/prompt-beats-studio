name: Submit Track preservation patch

on:
  push:
    branches:
      - feat/settings-preferences-redesign
    paths:
      - .github/workflows/settings-studio-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/settings-preferences-redesign
          fetch-depth: 0
      - name: Patch Studio initialization
        run: |
          python <<'PY'
          from pathlib import Path
          import re
          p = Path('src/components/promptbeats/StudioModal.tsx')
          s = p.read_text()
          pattern = re.compile(r'''  const \[rows, setRows\] = useState<Row\[\]>\(\[emptyRow\(\)\]\);\n  const wasOpenRef = useRef\(false\);\n  const \[busy, setBusy\] = useState\(false\);\n  const \[status, setStatus\] = useState<string \| null>\(null\);\n\n  useEffect\(\(\) => \{\n    if \(open && !wasOpenRef\.current\) \{\n      setRows\(\[emptyRow\(preferences\)\]\);\n      setStatus\(null\);\n    \}\n    wasOpenRef\.current = open;\n  \}, \[open, preferences\]\);''')
          replacement = '  const [rows, setRows] = useState<Row[]>([emptyRow()]);\n  const initialDefaultsAppliedRef = useRef(false);\n  const [busy, setBusy] = useState(false);\n  const [status, setStatus] = useState<string | null>(null);\n\n  useEffect(() => {\n    if (!open || initialDefaultsAppliedRef.current) return;\n    initialDefaultsAppliedRef.current = true;\n    setRows([emptyRow(preferences)]);\n    setStatus(null);\n  }, [open, preferences]);'
          s2, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'Studio initialization patch count: {count}')
          p.write_text(s2)
          PY
      - name: Commit patch
        run: |
          git config user.name "PromptBeats CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/promptbeats/StudioModal.tsx
          git commit -m "Preserve Submit Track drafts across reopen"
          git push origin HEAD:feat/settings-preferences-redesign
