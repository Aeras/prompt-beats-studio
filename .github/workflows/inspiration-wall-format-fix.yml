name: Inspiration Wall Formatting Fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspiration-wall-format-fix.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Fix formatting
        run: bunx prettier --write src/lib/inspiration-wall.functions.ts
      - name: Verify Inspiration Wall tests
        run: bun test src/lib/inspiration-wall.test.ts src/lib/feature-access-v2.test.ts
      - name: Verify lint
        run: bun run lint
      - name: Commit formatting fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/inspiration-wall.functions.ts
          if git diff --cached --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git commit -m "Fix Inspiration Wall formatting"
          git push origin HEAD:main
