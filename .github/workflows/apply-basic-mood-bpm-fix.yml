name: Apply basic mood and BPM fix

on:
  push:
    branches:
      - fix/basic-mood-and-bpm-order
    paths:
      - .github/workflows/apply-basic-mood-bpm-fix.yml

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[apply-basic-mood-bpm-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/basic-mood-and-bpm-order

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply focused generator fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/routes/generate.tsx')
          s = p.read_text()

          old_bpm = 'const BPM_OPTIONS = CATALOG_BPM_OPTIONS.map((option) => option.value);'
          new_bpm = 'const BPM_OPTIONS = ["Custom", ...CATALOG_BPM_OPTIONS.map((option) => option.value).filter((value) => value !== "Custom")];'
          if old_bpm not in s:
              raise SystemExit('Missing BPM_OPTIONS declaration')
          s = s.replace(old_bpm, new_bpm, 1)

          old_basic = '''            )} : (\n              <div className="grid gap-3 sm:grid-cols-2">\n                <select value={moods[0] ?? ""} onChange={(e) => pickPrimary(setMoods)(e.target.value)} aria-label={t("generator.mood")} className={fieldClass}><option value="" disabled className="bg-[#0a0a0c]">{t("generator.selectMood")}</option>{MOOD_OPTIONS.map((item) => <option key={item} value={item} className="bg-[#0a0a0c]">{item === CUSTOM ? t("generator.option.custom") : translatedOption(BASIC_MOODS, item, t)}</option>)}</select>\n                <select value={language} onChange={(e) => setLanguage(e.target.value)} aria-label={t("generator.language")} className={fieldClass}><option value="" disabled className="bg-[#0a0a0c]">{t("generator.selectLanguage")}</option>{LANGUAGE_OPTIONS.map((item) => <option key={item} value={item} className="bg-[#0a0a0c]">{item === CUSTOM ? t("generator.option.custom") : languageLabel(item)}</option>)}</select>\n              </div>\n            )}\n\n            {!advanced && moods[0] === CUSTOM && <input value={customMood} onChange={(e) => setCustomMood(e.target.value)} placeholder={t("generator.customMoodBasic")} aria-label={`${t("common.custom")} ${t("generator.mood")}`} className={fieldClass} />}'''

          new_basic = '''            )} : (\n              <div className="grid gap-3 sm:grid-cols-2">\n                <div className="space-y-3">\n                  <select value={moods[0] ?? ""} onChange={(e) => pickPrimary(setMoods)(e.target.value)} aria-label={t("generator.mood")} className={fieldClass}><option value="" disabled className="bg-[#0a0a0c]">{t("generator.selectMood")}</option>{MOOD_OPTIONS.map((item) => <option key={item} value={item} className="bg-[#0a0a0c]">{item === CUSTOM ? t("generator.option.custom") : translatedOption(BASIC_MOODS, item, t)}</option>)}</select>\n                  {moods[0] === CUSTOM && <input value={customMood} onChange={(e) => setCustomMood(e.target.value)} placeholder={t("generator.customMoodPlaceholder")} aria-label={`${t("common.custom")} ${t("generator.mood")}`} className={fieldClass} />}\n                </div>\n                <select value={language} onChange={(e) => setLanguage(e.target.value)} aria-label={t("generator.language")} className={fieldClass}><option value="" disabled className="bg-[#0a0a0c]">{t("generator.selectLanguage")}</option>{LANGUAGE_OPTIONS.map((item) => <option key={item} value={item} className="bg-[#0a0a0c]">{item === CUSTOM ? t("generator.option.custom") : languageLabel(item)}</option>)}</select>\n              </div>\n            )}'''

          if old_basic not in s:
              raise SystemExit('Missing expected Basic mood/language block')
          s = s.replace(old_basic, new_basic, 1)
          p.write_text(s)
          PY

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit validated changes
        shell: bash
        run: |
          rm .github/workflows/apply-basic-mood-bpm-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/generate.tsx .github/workflows/apply-basic-mood-bpm-fix.yml
          git commit -m "fix: align basic custom mood and BPM ordering [apply-basic-mood-bpm-fix]"
          git push origin HEAD:fix/basic-mood-and-bpm-order
