name: Feature Access V2 Diagnostic

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-feature-access-v2-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Make upload ordering check formatting-robust
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/lib/feature-access-v2.test.ts')
          text = path.read_text()
          old = '    const r2Upload = api.indexOf("uploadToR2(key");'
          new = '    const r2Upload = api.search(/uploadToR2\\(\\s*key\\s*,/);'
          if old not in text:
              raise SystemExit('Expected Track Uploads assertion pattern not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Feature Access V2 tests
        run: bun test src/lib/feature-access-v2.test.ts
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/feature-access-v2.test.ts
          git commit -m "Make Track Upload ordering test formatting-robust"
          git push origin HEAD:main
