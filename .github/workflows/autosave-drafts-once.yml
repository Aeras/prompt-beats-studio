name: Autosave drafts integration once

on:
  push:
    branches:
      - feat/autosave-drafts-all-editors
    paths:
      - .github/workflows/autosave-drafts-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/autosave-drafts-all-editors
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Integrate autosave across creative editors
        run: python scripts/autosave_patch.py
      - name: Format changed source
        run: bunx prettier --write src/lib/draft-autosave.ts src/lib/account-preferences.ts src/components/promptbeats/SettingsPanel.tsx src/routes/generate.tsx src/components/promptbeats/LyricsWorkspace.tsx src/routes/lyrics-review.tsx src/components/promptbeats/SongSetupAssistantModal.tsx src/components/promptbeats/StudioModal.tsx src/routes/song-universe.tsx src/routes/library.tsx src/routes/story-map.tsx src/routes/inspiration-wall.tsx src/components/promptbeats/PromptStandaloneDialogs.tsx src/lib/settings-preferences.test.ts
      - name: Focused validation
        run: |
          bun test src/lib/settings-preferences.test.ts
          bun run lint
          bunx tsc --noEmit --pretty false
      - name: Commit integration
        run: |
          git config user.name "PromptBeats CI"
          git config user.email "actions@users.noreply.github.com"
          git add src
          git commit -m "Autosave drafts across creative editors"
          git push origin HEAD:feat/autosave-drafts-all-editors
