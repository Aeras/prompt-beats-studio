name: Settings generator fix once

on:
  push:
    branches:
      - feat/autosave-drafts-all-editors
    paths:
      - .github/workflows/settings-generator-fix-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/autosave-drafts-all-editors
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: python scripts/settings_generator_fix.py
      - run: bunx prettier --write src/routes/generate.tsx src/components/promptbeats/SettingsPanel.tsx src/lib/settings-preferences.test.ts
      - run: |
          bun test src/lib/settings-preferences.test.ts
          bun run lint
          bunx tsc --noEmit --pretty false
      - run: |
          git config user.name "PromptBeats CI"
          git config user.email "actions@users.noreply.github.com"
          git add src
          git commit -m "Fix Generator defaults and settings order"
          git push origin HEAD:feat/autosave-drafts-all-editors
