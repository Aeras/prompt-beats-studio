name: Temporary Prompt Projects Type Fix

on:
  push:
    branches:
      - feat/prompt-projects-standalone-workflow

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[prompt-projects types fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Apply type fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          ai = Path('src/lib/ai.functions.ts')
          text = ai.read_text()
          for field in ['theme', 'genre', 'mood', 'language', 'tags', 'lyrics', 'note']:
              old = f'if (data.{field} !== undefined) patch.{field} = data.{field};'
              new = f'if (data.{field} !== undefined) patch.{field} = data.{field} ?? "";'
              if old not in text:
                  raise SystemExit(f'missing {field} assignment')
              text = text.replace(old, new, 1)
          ai.write_text(text)

          gen = Path('src/routes/generate.tsx')
          text = gen.read_text()
          old = 'setRevisionProjectId(job.input.revision.projectId);'
          new = 'setRevisionProjectId(job.input.revision.projectId ?? "");'
          if old not in text:
              raise SystemExit('missing revision project recovery')
          text = text.replace(old, new, 1)
          old = 'projectName={workspaceBase.data?.project.name ?? null}'
          new = 'projectName={workspaceBase.data?.project?.name ?? null}'
          if old not in text:
              raise SystemExit('missing workspace project name')
          text = text.replace(old, new, 1)
          gen.write_text(text)
          PY
          bunx prettier --write src/lib/ai.functions.ts src/routes/generate.tsx
          git diff --check
      - name: Verify strict TypeScript
        run: bunx tsc --noEmit --pretty false
      - name: Commit type fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Fix standalone Prompt revision types [prompt-projects types fixed]"
          git push
