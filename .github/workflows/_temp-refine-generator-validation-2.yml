name: Temporary refine generator validation 2

on:
  push:
    branches:
      - fix/generator-validation-ring

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Refine custom validation targeting'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/generator-validation-ring
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Refine custom-field targeting
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routes/generate.tsx')
          s = p.read_text()
          old = 'className={fieldClass + requiredControlClass("musicStyle")}\n                >'
          new = 'className={\n                    fieldClass +\n                    (genres[0] !== CUSTOM ? requiredControlClass("musicStyle") : "")\n                  }\n                >'
          if s.count(old) != 1:
              raise SystemExit(f'Expected one music style select target, found {s.count(old)}')
          s = s.replace(old, new)
          old = 'className={fieldClass + requiredControlClass("mood")}\n                  >'
          new = 'className={\n                      fieldClass +\n                      (moods[0] !== CUSTOM ? requiredControlClass("mood") : "")\n                    }\n                  >'
          if s.count(old) != 1:
              raise SystemExit(f'Expected one mood select target, found {s.count(old)}')
          s = s.replace(old, new)
          p.write_text(s)
          PY
      - run: bunx prettier --write src/routes/generate.tsx
      - run: |
          git config user.name "PromptBeats CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/routes/generate.tsx
          git diff --cached --check
          git commit -m "Refine custom validation targeting"
          git push origin HEAD:fix/generator-validation-ring
