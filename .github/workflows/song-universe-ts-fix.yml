name: Song Universe TypeScript fix

on:
  push:
    branches: [song-universe-step2]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Apply Song Universe TypeScript fixes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: song-universe-step2
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: python3 scripts/song-universe-ts-fix.py
      - run: bunx prettier --write src/lib/song-universe.shared.ts src/lib/song-universe.functions.ts src/components/promptbeats/SongUniverseInspirationPanel.tsx src/routes/song-universe.tsx
      - run: bunx tsc --noEmit --pretty false
      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src
          if ! git diff --cached --quiet; then
            git commit -m 'Apply Song Universe TypeScript fixes'
            git push origin song-universe-step2
          fi
