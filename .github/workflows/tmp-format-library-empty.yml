name: Temporary Library Empty Formatting

on:
  push:
    branches:
      - feat/library-empty-state-smart-presets

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/library-empty-state-smart-presets
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Format changed files
        run: bunx prettier --write src/components/promptbeats/LibraryTracksEmptyState.tsx src/components/promptbeats/SmartPresetsPanel.tsx src/routes/generate.tsx src/routes/library.tsx src/lib/library-folders.test.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/promptbeats/LibraryTracksEmptyState.tsx src/components/promptbeats/SmartPresetsPanel.tsx src/routes/generate.tsx src/routes/library.tsx src/lib/library-folders.test.ts
          git diff --cached --quiet || git commit -m "Format guided Library experience"
          git push origin HEAD:feat/library-empty-state-smart-presets
