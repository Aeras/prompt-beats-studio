name: Apply strict type fixes once

on:
  push:
    branches:
      - main
    paths:
      - .typefix-trigger

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Apply final strict-type fixes
        run: python scripts/fix-strict-type-errors-final.py
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify strict TypeScript
        continue-on-error: true
        run: bunx tsc --noEmit --pretty false 2>&1 | tee strict-after-fix.log
      - name: Commit fixes
        run: |
          git config user.name "Aeras"
          git config user.email "nkarypidis@gmail.com"
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git add src
          git commit -m "Finish strict TypeScript cleanup"
          git push origin HEAD:main
      - name: Upload post-fix report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-after-fix-report
          path: strict-after-fix.log
