name: Live search integration once

on:
  push:
    branches:
      - feat/live-search-everywhere
    paths:
      - .github/workflows/live-search-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/live-search-everywhere
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: python scripts/live_search_patch.py
      - run: bunx prettier --write src/components/promptbeats/AppShell.tsx src/routes/index.tsx src/lib/live-search.test.ts
      - run: |
          bun test src/lib/live-search.test.ts
          bun run lint
          bun run build
          bunx tsc --noEmit --pretty false
      - run: |
          git config user.name "PromptBeats CI"
          git config user.email "actions@users.noreply.github.com"
          git add src
          git commit -m "Enable live search across search surfaces"
          git push origin HEAD:feat/live-search-everywhere
