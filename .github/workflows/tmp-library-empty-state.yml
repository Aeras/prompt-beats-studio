name: Temporary Library Empty State

on:
  push:
    branches:
      - feat/library-empty-state-smart-presets

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/library-empty-state-smart-presets
          fetch-depth: 0
      - name: Apply Library empty state patch
        run: python3 scripts/tmp-library-empty-state.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/library.tsx src/routes/generate.tsx src/components/promptbeats/SmartPresetsPanel.tsx src/lib/library-folders.test.ts
          git commit -m "Add guided empty Library experience"
          git push origin HEAD:feat/library-empty-state-smart-presets
