name: Temporary refine generator validation

on:
  push:
    branches:
      - fix/generator-validation-ring

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Refine generator validation ring'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/generator-validation-ring
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Patch generator validation styling
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/routes/generate.tsx')
          s = p.read_text()

          replacements = [
            (
              '''  const requiredFieldClass = (key: RequiredFieldKey) =>\n    requiredValidationAttempted && missingRequiredKeys.has(key)\n      ? "-m-2 rounded-2xl p-2 ring-1 ring-accent/70 shadow-[0_0_24px_color-mix(in_oklab,var(--accent)_32%,transparent)] transition-shadow"\n      : "";''',
              '''  const requiredControlClass = (key: RequiredFieldKey) =>\n    requiredValidationAttempted && missingRequiredKeys.has(key)\n      ? " !border-red-400/70 shadow-[0_0_0_3px_color-mix(in_oklab,var(--destructive)_20%,transparent)] focus:!border-red-400/80 focus:shadow-[0_0_0_3px_color-mix(in_oklab,var(--destructive)_24%,transparent)]"\n      : "";\n  const requiredPickerClass = (key: RequiredFieldKey) =>\n    requiredValidationAttempted && missingRequiredKeys.has(key)\n      ? "[&>button]:!border-red-400/70 [&>button]:!shadow-[0_0_0_3px_color-mix(in_oklab,var(--destructive)_20%,transparent)]"\n      : "";'''
            ),
            ('<div ref={themeRequiredRef} className={requiredFieldClass("theme")}>', '<div ref={themeRequiredRef}>'),
            (
              'className="w-full rounded-xl border border-white/10 bg-black/40 p-4 text-sm outline-none transition-shadow placeholder:text-muted-foreground focus:border-primary/60 focus:shadow-[0_0_0_3px_color-mix(in_oklab,var(--neon)_22%,transparent)]"\n              />\n              <p className="mt-1 text-right text-[11px] text-muted-foreground">\n                {theme.length}/{themeLimit}',
              'className={`w-full rounded-xl border border-white/10 bg-black/40 p-4 text-sm outline-none transition-shadow placeholder:text-muted-foreground focus:border-primary/60 focus:shadow-[0_0_0_3px_color-mix(in_oklab,var(--neon)_22%,transparent)]${requiredControlClass("theme")}`}\n              />\n              <p className="mt-1 text-right text-[11px] text-muted-foreground">\n                {theme.length}/{themeLimit}'
            ),
            ('<div ref={musicStyleRequiredRef} className={requiredFieldClass("musicStyle")}>', '<div ref={musicStyleRequiredRef}>'),
            (
              'aria-label={t("generator.musicStyle")}\n                  className={fieldClass}\n                >',
              'aria-label={t("generator.musicStyle")}\n                  className={fieldClass + requiredControlClass("musicStyle")}\n                >'
            ),
            (
              'className={advanced ? fieldClass + " mt-2" : fieldClass}\n                />',
              'className={(advanced ? fieldClass + " mt-2" : fieldClass) + requiredControlClass("musicStyle")}\n                />'
            ),
            ('<div ref={moodRequiredRef} className={requiredFieldClass("mood")}>', '<div ref={moodRequiredRef}>'),
            (
              'maxLength={hasAdminInputBypass ? undefined : 120}\n                    className={fieldClass + " mt-2"}\n                  />',
              'maxLength={hasAdminInputBypass ? undefined : 120}\n                    className={fieldClass + " mt-2" + requiredControlClass("mood")}\n                  />'
            ),
            ('<div ref={languageRequiredRef} className={requiredFieldClass("language")}>', '<div ref={languageRequiredRef}>'),
            (
              'ariaLabel={t("generator.language")}\n                  />',
              'ariaLabel={t("generator.language")}\n                    className={language !== CUSTOM ? requiredPickerClass("language") : ""}\n                  />'
            ),
            (
              '<div ref={moodRequiredRef} className={`space-y-3 ${requiredFieldClass("mood")}`}>',
              '<div ref={moodRequiredRef} className="space-y-3">'
            ),
            (
              'aria-label={t("generator.mood")}\n                    className={fieldClass}\n                  >',
              'aria-label={t("generator.mood")}\n                    className={fieldClass + requiredControlClass("mood")}\n                  >'
            ),
            (
              'aria-label={`${t("common.custom")} ${t("generator.mood")}`}\n                      className={fieldClass}\n                    />',
              'aria-label={`${t("common.custom")} ${t("generator.mood")}`}\n                      className={fieldClass + requiredControlClass("mood")}\n                    />'
            ),
            (
              'aria-label={`${t("common.custom")} ${t("generator.language")}`}\n                className={fieldClass}\n              />',
              'aria-label={`${t("common.custom")} ${t("generator.language")}`}\n                className={fieldClass + requiredControlClass("language")}\n              />'
            ),
          ]

          for old, new in replacements:
              count = s.count(old)
              if count == 0:
                  raise SystemExit(f'Missing expected snippet: {old[:100]!r}')
              s = s.replace(old, new)

          if 'requiredFieldClass(' in s:
              raise SystemExit('Legacy requiredFieldClass usage remains')

          p.write_text(s)
          PY
      - run: bunx prettier --write src/routes/generate.tsx
      - run: |
          git config user.name "PromptBeats CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/routes/generate.tsx
          git diff --cached --check
          git commit -m "Refine generator validation ring"
          git push origin HEAD:fix/generator-validation-ring
