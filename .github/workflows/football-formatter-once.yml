name: Temporary football formatter (one-shot)

on:
  push:
    branches:
      - feature/private-ai-football-research-studio
    paths:
      - .github/workflows/football-formatter-once.yml

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'Aeras/prompt-beats-studio'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/private-ai-football-research-studio
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Format only football feature and scoped AI registry files
        run: |
          bunx prettier --write src/lib/football-*.ts src/routes/private/football-research.tsx src/lib/ai-usage.server.ts src/lib/ai-feature-access.server.ts
      - name: Commit formatting changes to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/football-*.ts src/routes/private/football-research.tsx src/lib/ai-usage.server.ts src/lib/ai-feature-access.server.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format integrated football research feature"
            git push origin HEAD:feature/private-ai-football-research-studio
          fi
