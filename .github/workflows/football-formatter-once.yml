name: Temporary football branch formatter

on:
  push:
    branches:
      - feature/private-ai-football-research-studio
    paths:
      - .github/workflows/football-formatter-once.yml

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'Aeras/prompt-beats-studio'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/private-ai-football-research-studio
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Format only the feature's changed source files
        run: |
          bunx prettier --write \
            src/lib/football-research.shared.ts \
            src/lib/football-research.shared.test.ts \
            src/lib/football-research.functions.ts \
            src/lib/football-fixtures.server.ts \
            src/lib/football-fixtures.server.test.ts \
            src/lib/football-fixtures-cache.server.ts \
            src/lib/football-fixtures-cache.server.test.ts \
            src/lib/football-prediction-evaluation.ts \
            src/lib/football-prediction-evaluation.test.ts \
            src/lib/football-ai-research.shared.ts \
            src/lib/football-ai-research.shared.test.ts \
            src/routes/private/football-research.tsx
      - name: Commit only formatting changes to the same branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/football-* src/routes/private/football-research.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style: format private football research files"
            git push origin HEAD:feature/private-ai-football-research-studio
          fi
