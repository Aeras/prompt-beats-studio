name: Browser quality gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-shard:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-24.04
    # Single-worker browser coverage exceeded the 25-minute job cap twice.
    # Four Playwright shards cover the same complete suite on isolated runners.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run browser viewport and accessibility gate
        run: bunx playwright test --shard=${{ matrix.shard }}/4

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7

  # Preserve the stable required status-check name while all shards must pass.
  browser-quality:
    if: always()
    needs: [browser-shard]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every browser shard to pass
        env:
          SHARD_RESULT: ${{ needs.browser-shard.result }}
        run: test "$SHARD_RESULT" = success
