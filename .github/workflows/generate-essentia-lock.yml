name: Generate Essentia lockfile
on:
  push:
    branches:
      - fix-essentia-local-loading

permissions:
  contents: write

jobs:
  lockfile:
    if: contains(github.event.head_commit.message, 'Add local Essentia.js dependency')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-essentia-local-loading
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - run: bun install
      - run: rm .github/workflows/generate-essentia-lock.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock .github/workflows/generate-essentia-lock.yml
          git commit -m "Update Bun lockfile for Essentia"
          git push origin HEAD:fix-essentia-local-loading
