name: Temporary Generator Mobile Results Fix

on:
  push:
    branches:
      - fix/generator-mobile-results-layout

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[generator-mobile-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Apply patch
        run: python .github/scripts/fix_generator_mobile_results.py
      - name: Format
        run: bunx prettier --write src/routes/generate.tsx src/lib/generator-mobile-regression.test.ts
      - name: Targeted test
        run: bun test src/lib/generator-mobile-regression.test.ts
      - name: Build
        run: bun run build
      - name: Strict TypeScript
        run: bunx tsc --noEmit --pretty false
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Restore Generator mobile result layout [generator-mobile-fixed]"
          git push
