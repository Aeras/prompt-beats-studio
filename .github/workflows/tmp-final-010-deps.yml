name: Temporary FINAL-010 deps

on:
  push:
    branches:
      - fix/final-010-browser-quality-gate

permissions:
  contents: write

jobs:
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-010-browser-quality-gate
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun add --dev @playwright/test@1.55.1 @axe-core/playwright@4.10.2
      - name: Commit dependency files
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          git commit -m "Add browser quality gate dependencies"
          git push origin HEAD:fix/final-010-browser-quality-gate
