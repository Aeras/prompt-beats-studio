name: Lint Format Cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-lint-formatting:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply ESLint formatting fixes
        run: |
          bunx eslint --fix \
            src/components/promptbeats/ProjectVersionHistory.tsx \
            src/lib/branching-versions.test.ts \
            src/lib/library-folders.test.ts
      - name: Verify affected tests
        run: bun test src/lib/project-version-history-ui.test.ts src/lib/branching-versions.test.ts src/lib/library-folders.test.ts
      - name: Verify lint
        run: bun run lint
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet -- src/components/promptbeats/ProjectVersionHistory.tsx src/lib/branching-versions.test.ts src/lib/library-folders.test.ts; then
            echo "No formatting changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/promptbeats/ProjectVersionHistory.tsx src/lib/branching-versions.test.ts src/lib/library-folders.test.ts
          git commit -m "Fix regression gate lint formatting"
          git push origin HEAD:main
