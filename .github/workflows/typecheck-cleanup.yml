name: Temporary strict typecheck cleanup

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Strict TypeScript report
        run: |
          bunx tsc --noEmit --pretty false > typecheck.log 2>&1 || true
          cat typecheck.log

      - name: Upload typecheck report
        uses: actions/upload-artifact@v4
        with:
          name: cleanup-typecheck-report
          path: typecheck.log
          retention-days: 1
