name: Database replay gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359
        with:
          version: 2.118.0

      - name: Setup Bun for registration verification
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2

      - name: Install locked registration tooling
        run: bun install --frozen-lockfile

      # The historical 20260921060300 bootstrap migration intentionally promoted
      # one already-existing verified admin account in production. A brand-new
      # database has no auth users, so the replay gate injects an ephemeral local
      # fixture immediately before that immutable historical migration. This file
      # exists only inside the CI workspace and is never committed or deployed.
      - name: Add local-only historical bootstrap fixture
        run: |
          cat > supabase/migrations/20260921060250_ci_super_admin_fixture.sql <<'SQL'
          INSERT INTO auth.users (
            id,
            aud,
            role,
            email,
            email_confirmed_at,
            created_at,
            updated_at,
            raw_app_meta_data,
            raw_user_meta_data
          )
          VALUES (
            '00000000-0000-0000-0000-000000000076'::uuid,
            'authenticated',
            'authenticated',
            'nikos76gr@gmail.com',
            now(),
            now(),
            now(),
            '{}'::jsonb,
            '{}'::jsonb
          );

          DELETE FROM public.user_roles
          WHERE user_id = '00000000-0000-0000-0000-000000000076'::uuid;

          INSERT INTO public.user_roles (user_id, role, moderation_status)
          VALUES (
            '00000000-0000-0000-0000-000000000076'::uuid,
            'admin'::public.app_role,
            'active'
          );
          SQL

      - name: Replay all migrations on a fresh local database
        run: supabase db start

      - name: AI usage receipt, permissions and recovery invariants (local only)
        run: |
          set -euo pipefail
          PROJECT_ID="$(sed -n 's/^project_id = "\(.*\)"/\1/p' supabase/config.toml)"
          test -n "$PROJECT_ID"
          docker exec -i "supabase_db_$PROJECT_ID" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/ai_usage_recovery.sql
          bash scripts/tests/ai-usage-db-races.sh "$PROJECT_ID"
          docker exec -i "supabase_db_$PROJECT_ID" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/upload_integrity.sql
          bash scripts/tests/upload-receipt-races.sh "$PROJECT_ID"
          docker exec -i "supabase_db_$PROJECT_ID" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/atomic_revision_finalize.sql
          bash scripts/tests/atomic-revision-db-races.sh "$PROJECT_ID"
          docker exec -i "supabase_db_$PROJECT_ID" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/stripe_checkout_reservation.sql
          bash scripts/tests/checkout-reservation-races.sh "$PROJECT_ID"
          docker exec -i "supabase_db_$PROJECT_ID" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/upload_success_quota.sql
          docker exec -i "supabase_db_$PROJECT_ID" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/ip_independent_admission.sql
          bash scripts/tests/ip-independent-admission-races.sh "$PROJECT_ID"
          docker exec -i "supabase_db_$PROJECT_ID" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/favorites_playlists.sql
          docker exec -i "supabase_db_$PROJECT_ID" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/private_review_finished_hard_delete.sql
          bash scripts/tests/private-review-hard-delete-races.sh "$PROJECT_ID"
          bash scripts/tests/favorites-playlists-races.sh "$PROJECT_ID"
          bun scripts/check-beta-features.ts --sql | docker exec -i "supabase_db_$PROJECT_ID" psql -U postgres -d postgres -v ON_ERROR_STOP=1
          docker exec -i "supabase_db_$PROJECT_ID" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/beta_feature_lifecycle.sql
          bash scripts/tests/beta-lifecycle-races.sh "$PROJECT_ID"
          bun scripts/tests/library-drift-reproduction.ts "$PROJECT_ID"
          docker exec -i "supabase_db_$PROJECT_ID" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/library_folder_reconciliation.sql
          bash scripts/tests/library-folder-races.sh "$PROJECT_ID"
          docker exec -i "supabase_db_$PROJECT_ID" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/ai_models_inline_admin.sql
          bash scripts/tests/ai-model-admin-races.sh "$PROJECT_ID"
          docker exec -i "supabase_db_$PROJECT_ID" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/ai_model_precise_dependencies.sql
          bash scripts/tests/ai-model-precise-dependency-races.sh "$PROJECT_ID"

          docker exec -i "supabase_db_$PROJECT_ID" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/global_ai_usage.sql
          bash scripts/tests/global-ai-usage-races.sh "$PROJECT_ID"

          docker exec -i "supabase_db_$PROJECT_ID" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/failed_generation_reconciliation.sql
          bash scripts/tests/failed-generation-reconciliation-races.sh "$PROJECT_ID"
          docker exec -i "supabase_db_$PROJECT_ID" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/song_atlas_beta.sql
          bash scripts/tests/song-atlas-races.sh "$PROJECT_ID"
          docker exec -i "supabase_db_$PROJECT_ID" psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/music_inspiration.sql
          bash scripts/tests/music-inspiration-races.sh "$PROJECT_ID"

      - name: Stop local Supabase database
        if: always()
        run: supabase stop --no-backup || true
