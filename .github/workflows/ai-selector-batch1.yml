name: AI selector batch 1

on:
  push:
    branches: [ai-model-selector-policy]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Implement conditional AI selectors batch 1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-model-selector-policy
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Apply selector policy
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def rep(path, old, new, count=1):
              p = Path(path); s = p.read_text()
              if old not in s: raise SystemExit(f'missing pattern {path}: {old[:100]!r}')
              p.write_text(s.replace(old, new, count))

          # Song Setup Assistant: conditional AI Tools selector, no hardcoded Gemini label.
          p = Path('src/components/promptbeats/SongSetupAssistantModal.tsx')
          s = p.read_text()
          s = s.replace('import { useI18n, type AppTranslationKey } from "@/i18n";\n',
                        'import { useI18n, type AppTranslationKey } from "@/i18n";\nimport { useAiModelSelection } from "@/hooks/useAiModelSelection";\n', 1)
          s = s.replace('  const [error, setError] = useState<string | null>(null);\n',
                        '  const [error, setError] = useState<string | null>(null);\n  const aiModel = useAiModelSelection("aiTools");\n', 1)
          s = s.replace('      const result = await generateSongSetup({ data: { description: clean, targetPlatform } });',
                        '      const result = await generateSongSetup({\n        data: {\n          description: clean,\n          targetPlatform,\n          ...(aiModel.selectedModel ? { model: aiModel.selectedModel } : {}),\n        },\n      });', 1)
          s = s.replace('              <span className="text-[11px] text-muted-foreground">\n                Gemini 3.8 Flash · {description.length}/2500\n              </span>',
                        '              <div className="flex items-center gap-2">\n                {aiModel.showSelector && (\n                  <select\n                    aria-label={language === "el" ? "Μοντέλο AI" : "AI model"}\n                    value={aiModel.selectedModel}\n                    onChange={(event) => aiModel.setSelectedModel(event.target.value)}\n                    className="rounded-lg border border-white/10 bg-black/30 px-2 py-1 text-[11px]"\n                  >\n                    {aiModel.options.map((option) => (\n                      <option key={option.id} value={option.id}>\n                        {option.label}\n                      </option>\n                    ))}\n                  </select>\n                )}\n                <span className="text-[11px] text-muted-foreground">\n                  {description.length}/2500\n                </span>\n              </div>', 1)
          s = s.replace('              disabled={busy || description.trim().length < 10}',
                        '              disabled={busy || description.trim().length < 10 || aiModel.unavailable}', 1)
          p.write_text(s)

          # Story Map standalone workspace: conditional AI Tools selector and selected model passed server-side.
          p = Path('src/routes/story-map.tsx'); s = p.read_text()
          s = s.replace('import { useFeatureAccess } from "@/hooks/useFeatureAccess";\n',
                        'import { useFeatureAccess } from "@/hooks/useFeatureAccess";\nimport { useAiModelSelection } from "@/hooks/useAiModelSelection";\n', 1)
          marker = 'function StoryMapWorkspace({\n  storyMap,\n  language,\n  onRefresh,\n'
          idx = s.find(marker)
          if idx < 0: raise SystemExit('StoryMapWorkspace marker missing')
          body_idx = s.find('{\n  const el = language === "el";', idx)
          if body_idx < 0: raise SystemExit('StoryMapWorkspace body missing')
          s = s[:body_idx] + s[body_idx:].replace('{\n  const el = language === "el";', '{\n  const el = language === "el";\n  const aiModel = useAiModelSelection("aiTools");', 1)
          s = s.replace('const result = await buildStoryMapWithAi({ data: { storyMapId: storyMap.id } });',
                        'const result = await buildStoryMapWithAi({\n        data: {\n          storyMapId: storyMap.id,\n          ...(aiModel.selectedModel ? { model: aiModel.selectedModel } : {}),\n        },\n      });', 1)
          # Add selector beside Build button using unique button label block.
          target = '''          <button\n            type="button"\n            onClick={buildWithAi}'''
          pos = s.find(target)
          if pos < 0: raise SystemExit('Story Map Build button missing')
          selector = '''          {aiModel.showSelector && (\n            <select\n              aria-label={el ? "Μοντέλο AI" : "AI model"}\n              value={aiModel.selectedModel}\n              onChange={(event) => aiModel.setSelectedModel(event.target.value)}\n              className="rounded-xl border border-white/10 bg-black/30 px-3 py-2 text-xs"\n            >\n              {aiModel.options.map((option) => (\n                <option key={option.id} value={option.id}>\n                  {option.label}\n                </option>\n              ))}\n            </select>\n          )}\n'''
          s = s[:pos] + selector + s[pos:]
          s = s.replace('            disabled={busy || !storyMap.concept.trim()}',
                        '            disabled={busy || !storyMap.concept.trim() || aiModel.unavailable}', 1)
          p.write_text(s)

          # Lyrics Workspace follows the fixed no-selector-for-one-model rule.
          rep('src/components/promptbeats/LyricsWorkspace.tsx',
              '{modelOptions.length > 0 && (',
              '{modelOptions.length > 1 && (')

          # Permanent regression coverage.
          Path('src/lib/ai-model-selector-policy.test.ts').write_text('''import { describe, expect, test } from "bun:test";\n\nasync function source(path: string) { return Bun.file(path).text(); }\n\ndescribe("AI model selector policy", () => {\n  test("shared hook hides the selector unless multiple eligible models exist", async () => {\n    const hook = await source("src/hooks/useAiModelSelection.ts");\n    expect(hook).toContain("showSelector: options.length > 1");\n    expect(hook).toContain("rawBucket?.defaultModel");\n    expect(hook).toContain("!options.some((option) => option.id === selectedModel)");\n  });\n  test("Song Setup Assistant uses AI Tools selection and has no hardcoded Gemini label", async () => {\n    const ui = await source("src/components/promptbeats/SongSetupAssistantModal.tsx");\n    expect(ui).toContain('useAiModelSelection("aiTools")');\n    expect(ui).toContain("aiModel.showSelector");\n    expect(ui).toContain("model: aiModel.selectedModel");\n    expect(ui).not.toContain("Gemini 3.8 Flash ·");\n  });\n  test("standalone Story Map uses the AI Tools selector only when needed", async () => {\n    const ui = await source("src/routes/story-map.tsx");\n    expect(ui).toContain('useAiModelSelection("aiTools")');\n    expect(ui).toContain("aiModel.showSelector");\n    expect(ui).toContain("model: aiModel.selectedModel");\n  });\n  test("Lyrics Workspace does not show a selector for a single model", async () => {\n    const ui = await source("src/components/promptbeats/LyricsWorkspace.tsx");\n    expect(ui).toContain("modelOptions.length > 1");\n  });\n});\n''')
          PY
          bunx prettier --write src/hooks/useAiModelSelection.ts src/components/promptbeats/SongSetupAssistantModal.tsx src/routes/story-map.tsx src/components/promptbeats/LyricsWorkspace.tsx src/lib/ai-model-selector-policy.test.ts
      - name: Validate
        run: |
          bun test src/lib/ai-model-selector-policy.test.ts src/lib/story-map.test.ts
          bun run lint
          bun run build
          bunx tsc --noEmit --pretty false
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src
          git commit -m 'Implement conditional AI selectors batch 1' || exit 0
          git push origin ai-model-selector-policy
