name: Track editor autosave once

on:
  push:
    branches:
      - feat/autosave-drafts-all-editors
    paths:
      - .github/workflows/autosave-track-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/autosave-drafts-all-editors
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: python scripts/autosave_track_patch.py
      - run: bunx prettier --write src/components/promptbeats/TrackOwnerActions.tsx src/lib/settings-preferences.test.ts
      - run: |
          bun test src/lib/settings-preferences.test.ts
          bun run lint
          bunx tsc --noEmit --pretty false
      - run: |
          git config user.name "PromptBeats CI"
          git config user.email "actions@users.noreply.github.com"
          git add src
          git commit -m "Autosave track edit drafts"
          git push origin HEAD:feat/autosave-drafts-all-editors
