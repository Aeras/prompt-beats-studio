name: Temporary Compact Card Actions

on:
  push:
    branches:
      - fix/compact-card-actions-spacing

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[compact-actions patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Apply patch
        run: python .github/scripts/fix_compact_card_actions.py
      - name: Format
        run: |
          bunx prettier --write \
            src/components/promptbeats/TrackCard.tsx \
            src/components/promptbeats/LikeButton.tsx \
            src/components/promptbeats/TrackLibraryActions.tsx \
            src/lib/track-card-action-row.test.ts
          git diff --check
      - name: Targeted regression
        run: bun test src/lib/track-card-action-row.test.ts
      - name: Build
        run: bun run build
      - name: Strict TypeScript
        run: bunx tsc --noEmit --pretty false
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Fix compact track card action spacing [compact-actions patched]"
          git push
