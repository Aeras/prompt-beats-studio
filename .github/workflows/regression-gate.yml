name: Regression gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Migration history immutability
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$PR_BASE_SHA"
            HEAD_SHA="$PR_HEAD_SHA"
          else
            BASE_SHA="$PUSH_BASE_SHA"
            HEAD_SHA="$PUSH_HEAD_SHA"
            if [[ "$BASE_SHA" =~ ^0+$ ]]; then
              BASE_SHA="${HEAD_SHA}^"
            fi
          fi

          echo "Checking migrations changed between $BASE_SHA and $HEAD_SHA"
          CHANGES="$(git diff --name-status --find-renames "$BASE_SHA" "$HEAD_SHA" -- supabase/migrations || true)"
          if [ -z "$CHANGES" ]; then
            echo "No migration files changed."
            exit 0
          fi

          echo "$CHANGES"

          # Temporary, exact allowlist for the production-history reconciliation in
          # PR #307. These three renames restore filenames to migration identities
          # already recorded in production Supabase. Every other non-additive change
          # remains blocked by this guard.
          VIOLATIONS="$(printf '%s\n' "$CHANGES" | awk '$1 == "A" { next } $1 ~ /^R[0-9]+$/ && (($2 == "supabase/migrations/20260929234500_song_universe_2_core.sql" && $3 == "supabase/migrations/20260929210439_song_universe_2_core.sql") || ($2 == "supabase/migrations/20260930003000_song_universe_2_trigger_execute_hardening.sql" && $3 == "supabase/migrations/20260929210730_song_universe_2_trigger_execute_hardening.sql") || ($2 == "supabase/migrations/20260930003000_bulk_prompt_project_delete.sql" && $3 == "supabase/migrations/20260929215330_bulk_prompt_project_delete.sql")) { next } NF > 0 { print }')"
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::Applied migration history is immutable. Existing migration files may not be modified, deleted, copied, or renamed. Add a new forward migration instead."
            printf '%s\n' "$VIOLATIONS"
            exit 1
          fi

          echo "Only new forward migrations or explicitly verified reconciliation renames were found."

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lyrics section parser tests
        run: bun test src/lib/lyrics-sections.test.ts

      - name: Lyrics Review deterministic tests
        run: bun test src/lib/lyrics-review.shared.test.ts

      - name: Lyrics Review integration tests
        run: bun test src/lib/lyrics-review-integration.test.ts

      - name: Private Review Link tests
        run: bun test src/lib/private-review.test.ts

      - name: Song Blueprint tests
        run: bun test src/lib/song-blueprint.test.ts

      - name: Song Arrangement data foundation tests
        run: bun test src/lib/song-arrangement.test.ts

      - name: Song Arrangement UI tests
        run: bun test src/lib/song-arrangement-ui.test.ts

      - name: Song Arrangement prompt tests
        run: bun test src/lib/song-arrangement-prompt.test.ts

      - name: Project Version History tests
        run: bun test src/lib/project-version-history.test.ts

      - name: Project Version Diff tests
        run: bun test src/lib/project-version-diff.test.ts

      - name: Project Version History UI tests
        run: bun test src/lib/project-version-history-ui.test.ts

      - name: Branching Versions tests
        run: bun test src/lib/branching-versions.test.ts

      - name: Library Folders tests
        run: bun test src/lib/library-folders.test.ts

      - name: Inspiration Wall Phase 1 tests
        run: bun test src/lib/inspiration-wall.test.ts

      - name: Inspiration Wall Phase 2 tests
        run: bun test src/lib/inspiration-wall-phase2.test.ts

      - name: Inspiration Wall Phase 3 tests
        run: bun test src/lib/inspiration-wall-phase3.test.ts

      - name: Inspiration Wall Phase 4 tests
        run: bun test src/lib/inspiration-wall-phase4.test.ts

      - name: Story Map tests
        run: bun test src/lib/story-map.test.ts

      - name: Song Universe tests
        run: bun test src/lib/song-universe.test.ts

      - name: AI Tools default architecture tests
        run: bun test src/lib/ai-tools-default-architecture.test.ts

      - name: Dynamic AI model selector tests
        run: bun test src/lib/ai-model-selector-policy.test.ts

      - name: Smart Presets and language catalog tests
        run: bun test src/catalog/smart-presets.test.ts src/catalog/song-languages.test.ts

      - name: Export Center tests
        run: bun test src/lib/export-center.shared.test.ts

      - name: Follow and Notifications tests
        run: bun test src/lib/follow-notifications.test.ts

      - name: Super Admin Phase A tests
        run: bun test src/lib/super-admin-phase-a.test.ts

      - name: Feature Access Phase B tests
        run: bun test src/lib/feature-access.test.ts

      - name: Feature Access V2 tests
        run: bun test src/lib/feature-access-v2.test.ts

      - name: Reports and Explicit Lyrics tests
        run: bun test src/lib/content-reports-explicit.test.ts

      - name: Moderation Cases and Appeals tests
        run: bun test src/lib/moderation-cases.test.ts

      - name: Help and Contact Us tests
        run: bun test src/lib/contact-help.test.ts

      - name: Supabase Auth email template tests
        run: bun test src/lib/auth-email-templates.test.ts

      - name: External Supabase cutover tests
        run: bun test src/lib/supabase-cutover.test.ts

      - name: September 22 audit hardening tests
        run: bun test src/lib/audit-hardening-20260922.test.ts

      - name: Step 7 AI usage and admission tests
        run: bun test src/lib/ai-usage-admission-step7.test.ts

      - name: Step 8 security hardening tests
        run: bun test src/lib/security-step8.test.ts

      - name: app_role_rank hardening test
        run: bun test src/lib/app-role-rank-hardening.test.ts

      - name: Mobile and tablet touch navigation tests
        run: bun test src/lib/mobile-touch-navigation.test.ts

      # Keep the named suites above for fast subsystem attribution, but always run
      # Bun's repository-wide discovery as the final test gate so newly added test
      # files cannot silently miss CI coverage.
      - name: Complete Bun test suite
        run: bun test

      # Some repository-wide tests materialize this migration-history fixture while
      # validating generated GitHub links. It is intentionally not canonical source;
      # make sure the test artifact cannot leak into the subsequent source lint pass.
      - name: Clean generated migration-history test fixture
        run: rm -f src/lib/__tests__/migration-history-integrity.test.ts

      # The repository currently contains pre-existing lint debt on main. Enforce
      # lint strictly on source files introduced or changed by this PR/push so a
      # focused fix cannot be blocked by unrelated baseline errors. workflow_dispatch
      # retains the repository-wide lint entry point for explicit baseline audits.
      - name: Lint changed source files
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE_SHA="$PR_BASE_SHA"
            HEAD_SHA="$PR_HEAD_SHA"
          else
            BASE_SHA="$PUSH_BASE_SHA"
            HEAD_SHA="$PUSH_HEAD_SHA"
            if [[ "$BASE_SHA" =~ ^0+$ ]]; then
              BASE_SHA="${HEAD_SHA}^"
            fi
          fi

          mapfile -d '' FILES < <(git diff --name-only -z --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" -- '*.js' '*.jsx' '*.ts' '*.tsx')
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No changed JavaScript/TypeScript source files to lint."
            exit 0
          fi

          printf 'Linting changed source: %s\n' "${FILES[@]}"
          bunx eslint "${FILES[@]}"

      - name: Lint full source tree
        if: github.event_name == 'workflow_dispatch'
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Strict TypeScript check
        run: |
          set -o pipefail
          bunx tsc --noEmit --pretty false 2>&1 | tee typecheck.log

      - name: Upload typecheck report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-typecheck-report
          path: typecheck.log
