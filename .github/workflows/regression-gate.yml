name: Regression gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lyrics section parser tests
        run: bun test src/lib/lyrics-sections.test.ts

      - name: Lyrics Review deterministic tests
        run: bun test src/lib/lyrics-review.shared.test.ts

      - name: Lyrics Review integration tests
        run: bun test src/lib/lyrics-review-integration.test.ts

      - name: Private Review Link tests
        run: bun test src/lib/private-review.test.ts

      - name: Song Blueprint tests
        run: bun test src/lib/song-blueprint.test.ts

      - name: Song Arrangement data foundation tests
        run: bun test src/lib/song-arrangement.test.ts

      - name: Song Arrangement UI tests
        run: bun test src/lib/song-arrangement-ui.test.ts

      - name: Song Arrangement prompt tests
        run: bun test src/lib/song-arrangement-prompt.test.ts

      - name: Project Version History tests
        run: bun test src/lib/project-version-history.test.ts

      - name: Project Version Diff tests
        run: bun test src/lib/project-version-diff.test.ts

      - name: Project Version History UI tests
        run: bun test src/lib/project-version-history-ui.test.ts

      - name: Branching Versions tests
        run: bun test src/lib/branching-versions.test.ts

      - name: Library Folders tests
        run: bun test src/lib/library-folders.test.ts

      - name: Inspiration Wall Phase 1 tests
        run: bun test src/lib/inspiration-wall.test.ts

      - name: Inspiration Wall Phase 2 tests
        run: bun test src/lib/inspiration-wall-phase2.test.ts

      - name: Inspiration Wall Phase 3 tests
        run: bun test src/lib/inspiration-wall-phase3.test.ts

      - name: Smart Presets and language catalog tests
        run: bun test src/catalog/smart-presets.test.ts src/catalog/song-languages.test.ts

      - name: Export Center tests
        run: bun test src/lib/export-center.shared.test.ts

      - name: Follow and Notifications tests
        run: bun test src/lib/follow-notifications.test.ts

      - name: Super Admin Phase A tests
        run: bun test src/lib/super-admin-phase-a.test.ts

      - name: Feature Access Phase B tests
        run: bun test src/lib/feature-access.test.ts

      - name: Feature Access V2 tests
        run: bun test src/lib/feature-access-v2.test.ts

      - name: Reports and Explicit Lyrics tests
        run: bun test src/lib/content-reports-explicit.test.ts

      - name: Moderation Cases and Appeals tests
        run: bun test src/lib/moderation-cases.test.ts

      - name: Help and Contact Us tests
        run: bun test src/lib/contact-help.test.ts

      - name: Supabase Auth email template tests
        run: bun test src/lib/auth-email-templates.test.ts

      - name: External Supabase cutover tests
        run: bun test src/lib/supabase-cutover.test.ts

      - name: September 22 audit hardening tests
        run: bun test src/lib/audit-hardening-20260922.test.ts

      - name: app_role_rank hardening test
        run: bun test src/lib/app-role-rank-hardening.test.ts

      # Lint the committed source tree before the build. The Lovable build plugin can
      # materialize generated helper files during bundling; those are build artifacts,
      # not canonical repository source and should not be treated as source-lint debt.
      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Strict TypeScript check
        run: |
          set -o pipefail
          bunx tsc --noEmit --pretty false 2>&1 | tee typecheck.log

      - name: Upload typecheck report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-typecheck-report
          path: typecheck.log
