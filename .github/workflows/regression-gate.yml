name: Regression gate

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lyrics section parser tests
        run: bun test src/lib/lyrics-sections.test.ts

      - name: Song Blueprint tests
        run: bun test src/lib/song-blueprint.test.ts

      - name: Smart Presets and language catalog tests
        run: bun test src/catalog/smart-presets.test.ts src/catalog/song-languages.test.ts

      - name: Export Center tests
        run: bun test src/lib/export-center.shared.test.ts

      - name: Follow and Notifications tests
        run: bun test src/lib/follow-notifications.test.ts

      - name: Super Admin Phase A tests
        run: bun test src/lib/super-admin-phase-a.test.ts

      - name: Feature Access Phase B tests
        run: bun test src/lib/feature-access.test.ts

      - name: Feature Access V2 tests
        run: bun test src/lib/feature-access-v2.test.ts

      - name: Reports and Explicit Lyrics tests
        run: bun test src/lib/content-reports-explicit.test.ts

      - name: Report queue and staff notification tests
        run: bun test src/lib/report-queue-notifications.test.ts

      - name: Moderation Cases and Appeals tests
        run: bun test src/lib/moderation-cases.test.ts

      - name: Help and Contact Us tests
        run: bun test src/lib/contact-help.test.ts

      - name: Supabase Auth email template tests
        run: bun test src/lib/auth-email-templates.test.ts

      - name: External Supabase cutover tests
        run: bun test src/lib/supabase-cutover.test.ts

      - name: app_role_rank hardening test
        run: bun test src/lib/app-role-rank-hardening.test.ts

      - name: Build
        run: bun run build

      # The repository has legacy lint debt that predates this gate. Keep the
      # lint report visible on every PR without making unrelated existing
      # violations block otherwise valid changes. Build remains mandatory.
      - name: Lint report
        continue-on-error: true
        run: bun run lint
