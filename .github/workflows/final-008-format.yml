name: FINAL-008 formatter

on:
  push:
    branches:
      - fix/final-008-ai-finalization-authority
    paths:
      - .github/workflows/final-008-format.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-008-ai-finalization-authority
      - name: Align formatting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("src/lib/ai.functions.ts")
          text = path.read_text()
          text = text.replace(
          '''    const { markQualityCheckProviderStarted, releaseQualityCheck } = await import(
            "@/lib/ai-finalization.server"
          );
          await markQualityCheckProviderStarted(context.userId, data.idempotencyKey);''',
          '''    const { markQualityCheckProviderStarted, releaseQualityCheck } = await import(
              "@/lib/ai-finalization.server"
            );
            await markQualityCheckProviderStarted(context.userId, data.idempotencyKey);'''
          )
          text = text.replace(
          '''      consumedId = await consumeCreation(
            context.userId,
            data.idempotencyKey,
            quality,
            provider,
            model,
          );''',
          '''      consumedId = await consumeCreation(
                context.userId,
                data.idempotencyKey,
                quality,
                provider,
                model,
              );'''
          )
          path.write_text(text)
          Path(".github/workflows/final-008-format.yml").unlink()
          PY
      - name: Commit formatting
        run: |
          git config user.name "PromptBeats Audit Bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/ai.functions.ts .github/workflows/final-008-format.yml
          git commit -m "Align FINAL-008 formatting"
          git push origin HEAD:fix/final-008-ai-finalization-authority
