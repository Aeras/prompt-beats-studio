name: Temporary Similar Songs Card Patch

on:
  push:
    branches:
      - feat/similar-songs-card-actions

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[similar-songs patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Apply patch
        run: python .github/scripts/similar_songs_card_patch.py
      - name: Format changed files
        run: |
          bunx prettier --write \
            src/components/promptbeats/TrackCard.tsx \
            src/components/promptbeats/TrackLibraryActions.tsx \
            src/components/promptbeats/ShareTrackButton.tsx \
            src/components/promptbeats/ReportTrackControl.tsx \
            src/components/promptbeats/LikeButton.tsx \
            src/components/promptbeats/SimilarSongsDialog.tsx \
            src/components/promptbeats/SimilarSongsMenuItem.tsx \
            src/lib/similar-songs.functions.ts \
            src/lib/similar-songs.shared.ts \
            src/lib/similar-songs.test.ts
          git diff --check
      - name: Run targeted tests
        run: bunx vitest run src/lib/similar-songs.test.ts src/lib/track-card-action-row.test.ts
      - name: Build
        run: bun run build
      - name: Strict TypeScript
        run: bunx tsc --noEmit --pretty false
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Add similar songs and refine track card actions [similar-songs patched]"
          git push
