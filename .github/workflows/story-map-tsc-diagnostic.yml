name: Story Map TypeScript diagnostic

on:
  push:
    branches: [story-map-step1]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.event.head_commit.message != 'Record Story Map TypeScript diagnostic'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: story-map-step1
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Apply current integration patches
        run: |
          python3 scripts/story-map-integrate-v4-fix.py
          python3 scripts/story-map-integrate-v4.py
          python3 scripts/story-map-ts-fix.py
          bunx prettier --write src/components/promptbeats/AppShell.tsx src/components/promptbeats/LyricsWorkspace.tsx src/components/promptbeats/StoryMapLyricsPanel.tsx src/routes/story-map.tsx src/routes/generate.tsx src/lib/story-map.shared.ts src/lib/story-map.functions.ts src/lib/story-map-ai.functions.ts src/lib/story-map-workspace.functions.ts src/lib/ai-admission.server.ts src/lib/ai-usage.server.ts src/lib/feature-access.functions.ts
          bun run build >/tmp/story-map-build.log 2>&1 || true
          bunx prettier --write src/routeTree.gen.ts || true
      - name: Record TypeScript diagnostics
        run: |
          set +e
          bunx tsc --noEmit --pretty false > story-map-tsc.txt 2>&1
          code=$?
          echo "tsc_exit=$code" >> story-map-tsc.txt
          cat story-map-tsc.txt
          exit 0
      - name: Commit diagnostic
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add story-map-tsc.txt
          git commit -m 'Record Story Map TypeScript diagnostic' || exit 0
          git push origin story-map-step1
