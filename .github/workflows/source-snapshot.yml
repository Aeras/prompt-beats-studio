name: Source snapshot

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: promptbeats-source-snapshot
          path: |
            src
            package.json
            tsconfig.json
            bun.lock
          if-no-files-found: error
          retention-days: 1
