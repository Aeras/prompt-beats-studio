name: Temporary Project Delete Patch

on:
  push:
    branches:
      - feat/project-delete-prompt-selection

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/project-delete-prompt-selection
          fetch-depth: 0
      - name: Apply project deletion patch
        run: python3 scripts/tmp-project-delete-patch.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/library.tsx src/lib/ai.functions.ts src/lib/library-folders.test.ts
          git commit -m "Wire selective prompt deletion into project removal"
          git push origin HEAD:feat/project-delete-prompt-selection
