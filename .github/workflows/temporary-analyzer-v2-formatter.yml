name: Temporary Analyzer V2 formatter
on:
  push:
    branches:
      - feature/analyzer-v2-installed-validation-20261022
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Format only changed Analyzer files
        run: |
          bunx prettier --write src/lib/ai-provider-registry.server.ts src/components/promptbeats/AiModelsPanel.tsx src/lib/music-analyzer-admin.functions.ts src/lib/song-analyzer-v2-admin-options.server.ts src/lib/song-analyzer-v2.functions.ts src/lib/song-analyzer-v2.server.ts src/lib/song-analyzer.functions.ts src/lib/song-analyzer-v2.test.ts
          bunx eslint --fix src/lib/ai-provider-registry.server.ts src/components/promptbeats/AiModelsPanel.tsx src/lib/music-analyzer-admin.functions.ts src/lib/song-analyzer-v2-admin-options.server.ts src/lib/song-analyzer-v2.functions.ts src/lib/song-analyzer-v2.server.ts src/lib/song-analyzer.functions.ts src/lib/song-analyzer-v2.test.ts
      - name: Commit only scoped formatter changes
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/lib/ai-provider-registry.server.ts src/components/promptbeats/AiModelsPanel.tsx src/lib/music-analyzer-admin.functions.ts src/lib/song-analyzer-v2-admin-options.server.ts src/lib/song-analyzer-v2.functions.ts src/lib/song-analyzer-v2.server.ts src/lib/song-analyzer.functions.ts src/lib/song-analyzer-v2.test.ts
            git commit -m "style(analyzer): format V2 installed-model verification files"
            git push origin HEAD:feature/analyzer-v2-installed-validation-20261022
          fi
