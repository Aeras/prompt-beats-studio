name: Temporary compact action spacing patch

on:
  push:
    branches:
      - "fix/compact-action-groups-spacing"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Patch compact card action groups
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"marker not found in {path}: {old}")
              text = text.replace(old, new, count)
              p.write_text(text)

          replace(
              "src/components/promptbeats/TrackCard.tsx",
              'className={cn("flex w-full items-center justify-between", compact ? "gap-3" : "gap-2")}',
              'className={cn("flex w-full items-center", compact ? "gap-0" : "justify-between gap-2")}',
          )
          replace(
              "src/components/promptbeats/TrackCard.tsx",
              'className={cn("flex shrink-0 items-center", compact ? "gap-1" : "gap-1")}',
              'className={cn("flex shrink-0 items-center", compact ? "gap-0" : "gap-1")}',
          )
          replace(
              "src/components/promptbeats/TrackCard.tsx",
              'compact ? "h-9 w-8" : "h-9 w-7"',
              'compact ? "h-9 w-7" : "h-9 w-7"',
              2,
          )
          replace(
              "src/components/promptbeats/TrackCard.tsx",
              'compact ? "gap-1" : "gap-0",',
              'compact ? "gap-0" : "gap-0",',
          )

          replace(
              "src/components/promptbeats/LikeButton.tsx",
              '"h-9 w-6 -ml-3 [&+div]:-ml-1 [&+div]:gap-0 [&+div>button]:w-6"',
              '"h-9 w-7"',
          )

          replace(
              "src/components/promptbeats/TrackLibraryActions.tsx",
              '? "grid h-9 w-8 place-items-center text-muted-foreground transition-colors hover:text-accent focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent/60 disabled:cursor-not-allowed disabled:text-muted-foreground/30 disabled:opacity-60"',
              '? "grid h-9 w-7 place-items-center text-muted-foreground transition-colors hover:text-accent focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent/60 disabled:cursor-not-allowed disabled:text-muted-foreground/30 disabled:opacity-60"',
          )
          replace(
              "src/components/promptbeats/TrackLibraryActions.tsx",
              'compact ? "flex shrink-0 items-center gap-1" : "flex shrink-0 items-center gap-0"',
              'compact ? "flex shrink-0 items-center gap-0" : "flex shrink-0 items-center gap-0"',
          )

          test = Path("src/lib/track-card-action-row.test.ts")
          text = test.read_text()
          text = text.replace(
              'expect(card).toContain(\'compact ? "gap-3" : "gap-2"\');',
              'expect(card).toContain(\'compact ? "gap-0" : "justify-between gap-2"\');',
          )
          text = text.replace(
              'expect(card).toContain(\'compact ? "h-9 w-8" : "h-9 w-7"\');',
              'expect(card).toContain(\'compact ? "h-9 w-7" : "h-9 w-7"\');',
          )
          text = text.replace('expect(libraryActions).toContain("h-9 w-8");\n', '')
          text = text.replace(
              'expect(like).toContain(\'"h-9 w-6 -ml-3 [&+div]:-ml-1 [&+div]:gap-0 [&+div>button]:w-6"\');',
              'expect(like).toContain(\'"h-9 w-7"\');',
          )
          text = text.replace(
              'expect(libraryActions).toContain("h-9 w-7");',
              'expect(libraryActions).toContain("h-9 w-7");\n    expect(libraryActions).toContain(\'compact ? "flex shrink-0 items-center gap-0"\');',
              1,
          )
          test.write_text(text)
          PY
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run compact action regression test
        run: bun test src/lib/track-card-action-row.test.ts
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/temp-compact-action-spacing.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Tighten compact card action groups"
          git push origin HEAD:fix/compact-action-groups-spacing
