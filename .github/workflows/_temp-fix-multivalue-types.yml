name: Temporary fix multivalue types

on:
  push:
    branches:
      - fix/generator-mode-multivalue-sync

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Fix Generator multi-value sync type narrowing'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/generator-mode-multivalue-sync
      - name: Fix strict type narrowing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routes/generate.tsx')
          s = p.read_text()
          a = 'const [onlyGenre] = selectedGenres;'
          b = 'const onlyGenre = selectedGenres[0]!;'
          c = 'const [onlyMood] = selectedMoods;'
          d = 'const onlyMood = selectedMoods[0]!;'
          if s.count(a) != 1 or s.count(c) != 1:
              raise SystemExit(f'Unexpected occurrences: genre={s.count(a)}, mood={s.count(c)}')
          p.write_text(s.replace(a,b).replace(c,d))
          PY
      - run: |
          git config user.name "PromptBeats CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/routes/generate.tsx
          git diff --cached --check
          git commit -m "Fix Generator multi-value sync type narrowing"
          git push origin HEAD:fix/generator-mode-multivalue-sync
