name: Temporary Prompt Projects Formatter

on:
  push:
    branches:
      - feat/prompt-projects-standalone-workflow

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[prompt-projects formatted]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Format changed application files
        run: |
          bunx prettier --write \
            src/components/promptbeats/PromptStandaloneDialogs.tsx \
            src/lib/generation-jobs.server.ts \
            src/lib/library-folders.test.ts \
            src/lib/lyrics-workspace.functions.ts \
            src/routes/library.tsx
          git diff --check
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format Prompt and Project workflow changes [prompt-projects formatted]"
          git push
