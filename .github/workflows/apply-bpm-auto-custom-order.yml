name: Apply BPM auto custom order

on:
  push:
    branches:
      - fix/bpm-auto-custom-order
    paths:
      - .github/workflows/apply-bpm-auto-custom-order.yml

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[apply-bpm-order]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bpm-auto-custom-order

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply BPM ordering fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/routes/generate.tsx')
          s = p.read_text()
          old = 'const BPM_OPTIONS = ["Custom", ...CATALOG_BPM_OPTIONS.map((option) => option.value).filter((value) => value !== "Custom")];'
          new = 'const BPM_OPTIONS = ["Auto", "Custom", ...CATALOG_BPM_OPTIONS.map((option) => option.value).filter((value) => value !== "Auto" && value !== "Custom")];'
          if old not in s:
              raise SystemExit('Missing expected BPM_OPTIONS declaration')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Lint (record existing issues)
        run: npm run lint || true

      - name: Build
        run: npm run build

      - name: Commit validated changes
        shell: bash
        run: |
          rm .github/workflows/apply-bpm-auto-custom-order.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/generate.tsx .github/workflows/apply-bpm-auto-custom-order.yml
          git commit -m "fix: keep Auto first and Custom second in BPM [apply-bpm-order]"
          git push origin HEAD:fix/bpm-auto-custom-order
