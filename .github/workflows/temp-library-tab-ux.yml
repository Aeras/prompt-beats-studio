name: Temporary Library tab UX patch

on:
  push:
    branches:
      - fix/library-tab-persistence-mobile-nav

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/library-tab-persistence-mobile-nav
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Patch Library tab navigation
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/routes/library.tsx')
          s = p.read_text()

          old = '\nconst TABS = ["tracks", "playlists", "shared", "prompts", "favorites", "likes"] as const;\nfunction LibraryPage() {'
          new = '\nfunction LibraryPage() {'
          assert old in s
          s = s.replace(old, new, 1)

          old = 'export const Route = createFileRoute("/library")({\n  head: () => ({'
          new = '''const TABS = ["tracks", "playlists", "shared", "prompts", "favorites", "likes"] as const;\ntype LibraryTab = (typeof TABS)[number];\n\nfunction parseLibraryTab(value: unknown): LibraryTab {\n  return typeof value === "string" && TABS.includes(value as LibraryTab)\n    ? (value as LibraryTab)\n    : "tracks";\n}\n\nexport const Route = createFileRoute("/library")({\n  validateSearch: (search: Record<string, unknown>) => ({\n    tab: parseLibraryTab(search.tab),\n  }),\n  head: () => ({'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '  const { t, language } = useI18n();\n  const { user, profile, loading } = useAuth();'
          new = '  const { t, language } = useI18n();\n  const navigate = useNavigate();\n  const { tab: requestedTab } = Route.useSearch();\n  const { user, profile, loading } = useAuth();'
          assert old in s
          s = s.replace(old, new, 1)

          old = '  const [trackSource, setTrackSource] = useState<TrackSourcePreference>(defaultTrackSource);\n  const [tab, setTab] = useState<(typeof TABS)[number]>("tracks");\n  const [promptView, setPromptView] = useState<"all" | "projects" | "analyses">("all");'
          new = '  const [trackSource, setTrackSource] = useState<TrackSourcePreference>(defaultTrackSource);\n  const tabStripRef = useRef<HTMLDivElement>(null);\n  const [showTabFade, setShowTabFade] = useState(false);\n  const [promptView, setPromptView] = useState<"all" | "projects" | "analyses">("all");'
          assert old in s
          s = s.replace(old, new, 1)

          old = '''  useEffect(() => {\n    if (!availableTabs.includes(tab)) setTab("tracks");\n  }, [availableTabs, tab]);\n\n  useEffect(() => {\n    if (promptView === "analyses" && !analyzerAccess.allowed) {'''
          new = '''  const tab = availableTabs.includes(requestedTab) ? requestedTab : "tracks";\n\n  useEffect(() => {\n    if (requestedTab !== tab) {\n      void navigate({ to: "/library", search: { tab }, replace: true });\n    }\n  }, [navigate, requestedTab, tab]);\n\n  useEffect(() => {\n    const strip = tabStripRef.current;\n    if (!strip) return;\n    const activeTab = strip.querySelector<HTMLElement>(`[data-library-tab="${tab}"]`);\n    activeTab?.scrollIntoView({ block: "nearest", inline: "center" });\n  }, [tab, availableTabs.length]);\n\n  useEffect(() => {\n    const strip = tabStripRef.current;\n    if (!strip) return;\n\n    const updateFade = () => {\n      setShowTabFade(strip.scrollLeft + strip.clientWidth < strip.scrollWidth - 2);\n    };\n\n    updateFade();\n    strip.addEventListener("scroll", updateFade, { passive: true });\n    window.addEventListener("resize", updateFade);\n    const resizeObserver =\n      typeof ResizeObserver === "undefined" ? null : new ResizeObserver(updateFade);\n    resizeObserver?.observe(strip);\n\n    return () => {\n      strip.removeEventListener("scroll", updateFade);\n      window.removeEventListener("resize", updateFade);\n      resizeObserver?.disconnect();\n    };\n  }, [availableTabs.length]);\n\n  useEffect(() => {\n    if (promptView === "analyses" && !analyzerAccess.allowed) {'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''        <div className="mt-4 flex gap-2 overflow-x-auto pb-1 [scrollbar-width:none]">\n          {availableTabs.map((item) => (\n            <button\n              key={item}\n              onClick={() => setTab(item)}\n              className={cn(\n                "shrink-0 rounded-full border px-4 py-1.5 text-xs transition-all",\n                tab === item\n                  ? "border-transparent bg-gradient-neon font-semibold text-primary-foreground glow-neon"\n                  : "border-white/10 text-muted-foreground hover:border-accent/50 hover:text-accent",\n              )}\n            >\n              {tabLabel(item)}\n            </button>\n          ))}\n        </div>'''
          new = '''        <div className="relative mt-4">\n          <div\n            ref={tabStripRef}\n            className="flex snap-x snap-mandatory gap-2 overflow-x-auto scroll-smooth pb-1 pr-8 [scrollbar-width:none] [&::-webkit-scrollbar]:hidden md:pr-0"\n          >\n            {availableTabs.map((item) => (\n              <button\n                key={item}\n                type="button"\n                data-library-tab={item}\n                onClick={() => void navigate({ to: "/library", search: { tab: item } })}\n                className={cn(\n                  "shrink-0 snap-center rounded-full border px-4 py-1.5 text-xs transition-all",\n                  tab === item\n                    ? "border-transparent bg-gradient-neon font-semibold text-primary-foreground glow-neon"\n                    : "border-white/10 text-muted-foreground hover:border-accent/50 hover:text-accent",\n                )}\n              >\n                {tabLabel(item)}\n              </button>\n            ))}\n          </div>\n          {showTabFade && (\n            <div\n              aria-hidden="true"\n              className="pointer-events-none absolute inset-y-0 right-0 w-12 bg-gradient-to-l from-background via-background/85 to-transparent md:hidden"\n            />\n          )}\n        </div>'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('src/lib/feature-access-v2.test.ts')
          s = p.read_text()
          old = '    expect(library).toContain(\'if (!availableTabs.includes(tab)) setTab("tracks")\');'
          new = '    expect(library).toContain("availableTabs.includes(requestedTab)");\n    expect(library).toContain(\'replace: true\');'
          assert old in s
          p.write_text(s.replace(old, new, 1))

          p = Path('src/lib/library-folders.test.ts')
          s = p.read_text()
          marker = '''  test("duplicate provenance columns exist without creating a branch graph", async () => {\n    const sql = await source("supabase/migrations/20260922184000_library_folders_foundation.sql");\n\n    expect(sql).toContain("duplicated_from_project_id");\n    expect(sql).toContain("duplicated_from_prompt_id");\n  });\n'''
          addition = marker + '''\n  test("Library tabs persist in the URL and mobile tab navigation exposes overflow affordances", async () => {\n    const library = await source("src/routes/library.tsx");\n\n    expect(library).toContain("validateSearch");\n    expect(library).toContain("parseLibraryTab(search.tab)");\n    expect(library).toContain("Route.useSearch()");\n    expect(library).toContain('search: { tab: item }');\n    expect(library).toContain("snap-x snap-mandatory");\n    expect(library).toContain("snap-center");\n    expect(library).toContain("showTabFade");\n    expect(library).toContain("bg-gradient-to-l from-background");\n    expect(library).toContain("scrollIntoView");\n    expect(library).toContain('inline: "center"');\n  });\n'''
          assert marker in s
          p.write_text(s.replace(marker, addition, 1))
          PY
          bunx prettier --write src/routes/library.tsx src/lib/feature-access-v2.test.ts src/lib/library-folders.test.ts
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/library.tsx src/lib/feature-access-v2.test.ts src/lib/library-folders.test.ts
          git commit -m "Persist Library tabs and improve mobile tab navigation"
          git push origin HEAD:fix/library-tab-persistence-mobile-nav
