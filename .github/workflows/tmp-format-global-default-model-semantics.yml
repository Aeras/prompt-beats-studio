name: Temporary format global default model changes

on:
  push:
    branches:
      - fix/global-default-model-semantics

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/global-default-model-semantics
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Format changed source files
        run: |
          bunx prettier --write \
            src/components/promptbeats/AiModelsPanel.tsx \
            src/lib/ai-model-admin.functions.ts \
            src/lib/ai-provider.server.ts \
            src/lib/audit-hardening-20260922.test.ts \
            src/lib/final-003-ai-default-invariant.test.ts
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then
            echo "No formatting changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/promptbeats/AiModelsPanel.tsx src/lib/ai-model-admin.functions.ts src/lib/ai-provider.server.ts src/lib/audit-hardening-20260922.test.ts src/lib/final-003-ai-default-invariant.test.ts
          git commit -m "Format global default model changes"
          git push origin HEAD:fix/global-default-model-semantics
