name: Apply AI selector Story Map

on:
  push:
    branches: [ai-model-selector-policy]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply Story Map selector policy'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-model-selector-policy
          fetch-depth: 0
      - name: Patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/routes/story-map.tsx')
          s=p.read_text()
          if 'useAiModelSelection' not in s:
            s=s.replace('import { useFeatureAccess } from "@/hooks/useFeatureAccess";','import { useFeatureAccess } from "@/hooks/useFeatureAccess";\nimport { useAiModelSelection } from "@/hooks/useAiModelSelection";',1)
          old='''}) {\n  const el = language === "el";\n  const [busy, setBusy] = useState(false);'''
          new='''}) {\n  const el = language === "el";\n  const aiModel = useAiModelSelection("aiTools");\n  const [busy, setBusy] = useState(false);'''
          if old not in s: raise SystemExit('workspace body missing')
          s=s.replace(old,new,1)
          old='const result = await buildStoryMapWithAi({ data: { storyMapId: storyMap.id } });'
          new='''const result = await buildStoryMapWithAi({\n        data: {\n          storyMapId: storyMap.id,\n          ...(aiModel.selectedModel ? { model: aiModel.selectedModel } : {}),\n        },\n      });'''
          if old not in s: raise SystemExit('build call missing')
          s=s.replace(old,new,1)
          old='''          <div className="flex flex-wrap gap-2">\n            <button\n              type="button"\n              onClick={() => void build()}\n              disabled={busy}'''
          new='''          <div className="flex flex-wrap gap-2">\n            {aiModel.showSelector && (\n              <select\n                aria-label={el ? "Μοντέλο AI" : "AI model"}\n                value={aiModel.selectedModel}\n                onChange={(event) => aiModel.setSelectedModel(event.target.value)}\n                className="rounded-xl border border-white/10 bg-black/30 px-3 py-2 text-xs"\n              >\n                {aiModel.options.map((option) => (\n                  <option key={option.id} value={option.id}>{option.label}</option>\n                ))}\n              </select>\n            )}\n            <button\n              type="button"\n              onClick={() => void build()}\n              disabled={busy || aiModel.unavailable}'''
          if old not in s: raise SystemExit('build button missing')
          s=s.replace(old,new,1)
          p.write_text(s)

          p=Path('src/components/promptbeats/LyricsWorkspace.tsx')
          s=p.read_text()
          if '{modelOptions.length > 0 && (' in s:
            s=s.replace('{modelOptions.length > 0 && (','{modelOptions.length > 1 && (',1)
            p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/routes/story-map.tsx src/components/promptbeats/LyricsWorkspace.tsx
          git commit -m 'Apply Story Map selector policy' || exit 0
          git push origin ai-model-selector-policy
