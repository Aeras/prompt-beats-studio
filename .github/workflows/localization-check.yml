name: Localization check

on:
  push:
    branches:
      - feat/localization-foundation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Patch remaining management localization gaps
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/routes/management.tsx")
          text = path.read_text()
          text = text.replace(
              'import { useI18n, type AppTranslationKey } from "@/i18n";\n',
              'import { useI18n, type AppTranslationKey } from "@/i18n";\nimport { localizedAccountReasonLabel } from "@/i18n/ui-catalog";\n',
          )
          text = text.replace(
              'const reasonLabel = (code: string) => BLOCK_REASONS.find((reason) => reason.code === code)?.label ?? code;',
              'const reasonLabel = (code: string, t: T) => {\n  const reason = BLOCK_REASONS.find((item) => item.code === code);\n  return reason ? localizedAccountReasonLabel(reason.code, reason.label, t) : code;\n};',
          )
          text = text.replace(
              '{BLOCK_REASONS.map((reason) => <option key={reason.code} value={reason.code}>{reason.label}</option>)}',
              '{BLOCK_REASONS.map((reason) => <option key={reason.code} value={reason.code}>{localizedAccountReasonLabel(reason.code, reason.label, t)}</option>)}',
          )
          import re
          text = re.sub(r'reasonLabel\(([^)\n]+)\)', r'reasonLabel(\1, t)', text)
          path.write_text(text)
          PY
          if ! git diff --quiet -- src/routes/management.tsx; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/routes/management.tsx
            git commit -m "Finish management reason localization"
            git push origin HEAD:feat/localization-foundation
          fi
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Lint
        id: lint
        continue-on-error: true
        run: bun run lint 2>&1 | tee lint.log
      - name: Build
        id: build
        continue-on-error: true
        run: bun run build 2>&1 | tee build.log
      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: localization-validation-logs
          path: |
            lint.log
            build.log
      - name: Fail if validation failed
        if: steps.lint.outcome == 'failure' || steps.build.outcome == 'failure'
        run: exit 1
