name: AI selector backend fix

on:
  push:
    branches: [ai-model-selector-policy]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Fix Song Universe AI model routing contracts'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-model-selector-policy
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: python3 scripts/ai-selector-backend-fix.py
      - name: Format touched selector sources
        run: bunx prettier --write src/lib/song-universe-ai.functions.ts src/components/promptbeats/SongSetupAssistantModal.tsx src/routes/story-map.tsx
      - run: bun test src/lib/song-universe.test.ts src/lib/ai-model-selector-policy.test.ts
      - run: bun run lint
      - run: bun run build
      - run: bunx tsc --noEmit --pretty false
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/song-universe-ai.functions.ts src/components/promptbeats/SongSetupAssistantModal.tsx src/routes/story-map.tsx
          git commit -m 'Fix Song Universe AI model routing contracts'
          git push origin ai-model-selector-policy
