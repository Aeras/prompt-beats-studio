name: AI selector final surfaces

on:
  push:
    branches: [ai-model-selector-policy]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Apply final AI selector surfaces'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-model-selector-policy
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: python3 scripts/ai-selector-final-surfaces.py
      - name: Format touched sources
        run: bunx prettier --write src/routes/song-universe.tsx src/lib/inspiration-wall-ai.functions.ts src/components/promptbeats/InspirationWallDirectionPanel.tsx src/components/promptbeats/AiModelsPanel.tsx src/lib/ai-model-capabilities.shared.ts src/lib/ai-model-selector-policy.test.ts
      - name: Focused tests
        run: bun test src/lib/ai-tools-default-architecture.test.ts src/lib/ai-model-selector-policy.test.ts src/lib/song-universe.test.ts src/lib/inspiration-wall-phase4.test.ts
      - run: bun run lint
      - run: bun run build
      - run: bunx tsc --noEmit --pretty false
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src
          git commit -m 'Apply final AI selector surfaces'
          git push origin ai-model-selector-policy
