name: AI selector backend fix

on:
  push:
    branches: [ai-model-selector-policy]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Fix Song Universe AI model routing contracts'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-model-selector-policy
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Patch Song Universe AI contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/lib/song-universe-ai.functions.ts')
          s = p.read_text()

          def once(old, new, label):
              global s
              if old not in s:
                  raise SystemExit(f'missing anchor: {label}')
              s = s.replace(old, new, 1)

          once('const projectFitSchema = z.object({\n  strongMatches:', 'const projectFitSchema = z.object({\n  strongMatches:', 'project fit schema')
          anchor = '});\n\nconst CREATIVE_BIBLE_SYSTEM'
          if 'type SongUniverseProjectFit' not in s:
              if anchor not in s:
                  raise SystemExit('missing anchor: project fit type insertion')
              s = s.replace(anchor, '});\ntype SongUniverseProjectFit = z.infer<typeof projectFitSchema>;\n\nconst CREATIVE_BIBLE_SYSTEM', 1)

          s = s.replace('requestedModel: data.model,', 'requestedModel: data.model ?? null,')

          # Four structured calls occur in order: generate, refine, continuity, project fit.
          needle = 'runStructured({'
          positions = []
          start = 0
          while True:
              i = s.find(needle, start)
              if i < 0: break
              positions.append(i)
              start = i + len(needle)
          if len(positions) < 4:
              raise SystemExit(f'expected at least 4 runStructured calls, found {len(positions)}')
          replacements = [
              'runStructured<SongUniverseCreativeBible>({',
              'runStructured<SongUniverseCreativeBible>({',
              'runStructured<SongUniverseAnalysis>({',
              'runStructured<SongUniverseProjectFit>({',
          ]
          offset = 0
          for pos, replacement in zip(positions[:4], replacements):
              pos += offset
              s = s[:pos] + replacement + s[pos + len(needle):]
              offset += len(replacement) - len(needle)

          # Generate and refine endpoints: expose creativeBible, not internal value.
          before = '    return result;\n  });\n\nconst refineBibleInput'
          after = '''    return {
      creativeBible: result.value,
      model: result.model,
      provider: result.provider,
      modelLabel: result.modelLabel,
    };
  });

const refineBibleInput'''
          once(before, after, 'generate response')
          before = '    return result;\n  });\n\nconst continuityInput'
          after = '''    return {
      creativeBible: result.value,
      model: result.model,
      provider: result.provider,
      modelLabel: result.modelLabel,
    };
  });

const continuityInput'''
          once(before, after, 'refine response')

          once('await context.supabase.from("song_universe_ai_analyses").insert({', 'await (context.supabase as any).from("song_universe_ai_analyses").insert({', 'analysis insert typing')
          before = '    return result;\n  });\n\nconst projectFitInput'
          after = '''    return {
      analysis: result.value,
      model: result.model,
      provider: result.provider,
      modelLabel: result.modelLabel,
    };
  });

const projectFitInput'''
          once(before, after, 'continuity response')

          # Project fit now has typed result; replace direct return with named result and public fit key.
          once('    return runStructured<SongUniverseProjectFit>({', '    const result = await runStructured<SongUniverseProjectFit>({', 'fit await')
          fit_tail = '''      operation: "universe_project_fit",
    });
  });

export const getLatestSongUniverseContinuity'''
          fit_new = '''      operation: "universe_project_fit",
    });
    return {
      fit: result.value,
      model: result.model,
      provider: result.provider,
      modelLabel: result.modelLabel,
    };
  });

export const getLatestSongUniverseContinuity'''
          once(fit_tail, fit_new, 'fit response')

          once('const { data: row, error } = await context.supabase\n      .from("song_universe_ai_analyses")', 'const { data: row, error } = await (context.supabase as any)\n      .from("song_universe_ai_analyses")', 'latest analysis typing')
          once('''    if (error) throw new Error(error.message);
    return { analysis: row ?? null };
  });''', '''    if (error) throw new Error(error.message);
    if (!row) return { analysis: null, model: null, createdAt: null };
    return {
      analysis: songUniverseAnalysisSchema.parse(row.result),
      model: typeof row.model === "string" ? row.model : null,
      createdAt: typeof row.created_at === "string" ? row.created_at : null,
    };
  });''', 'latest analysis response')

          p.write_text(s)
          PY
          bunx prettier --write src/lib/song-universe-ai.functions.ts
      - name: Validate strict TypeScript and tests
        run: |
          bun test src/lib/song-universe.test.ts src/lib/ai-model-selector-policy.test.ts
          bun run lint
          bun run build
          bunx tsc --noEmit --pretty false
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/song-universe-ai.functions.ts
          git commit -m 'Fix Song Universe AI model routing contracts'
          git push origin ai-model-selector-policy
