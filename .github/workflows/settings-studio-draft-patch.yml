name: Settings Studio draft patch

on:
  push:
    branches:
      - feat/settings-preferences-redesign
    paths:
      - .github/workflows/settings-studio-draft-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/settings-preferences-redesign
          fetch-depth: 0
      - name: Preserve Submit Track drafts while applying defaults
        shell: python
        run: |
          from pathlib import Path
          p = Path("src/components/promptbeats/StudioModal.tsx")
          text = p.read_text()
          old = '''  const [rows, setRows] = useState<Row[]>([emptyRow()]);
  const wasOpenRef = useRef(false);
  const [busy, setBusy] = useState(false);
  const [status, setStatus] = useState<string | null>(null);

  useEffect(() => {
    if (open && !wasOpenRef.current) {
      setRows([emptyRow(preferences)]);
      setStatus(null);
    }
    wasOpenRef.current = open;
  }, [open, preferences]);'''
          new = '''  const [rows, setRows] = useState<Row[]>([emptyRow()]);
  const initialDefaultsAppliedRef = useRef(false);
  const [busy, setBusy] = useState(false);
  const [status, setStatus] = useState<string | null>(null);

  useEffect(() => {
    if (!open || initialDefaultsAppliedRef.current) return;
    initialDefaultsAppliedRef.current = true;
    setRows([emptyRow(preferences)]);
    setStatus(null);
  }, [open, preferences]);'''
          if old not in text:
              raise SystemExit("Studio default initialization anchor not found")
          p.write_text(text.replace(old, new, 1))
      - name: Commit draft-safe integration
        run: |
          git config user.name "PromptBeats CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/promptbeats/StudioModal.tsx
          git commit -m "Preserve Submit Track drafts across modal reopen"
          git push origin HEAD:feat/settings-preferences-redesign
