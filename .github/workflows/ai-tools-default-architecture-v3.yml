name: AI Tools default architecture v3

on:
  push:
    branches: [ai-tools-default-architecture]

permissions:
  contents: write

jobs:
  implement:
    if: github.event.head_commit.message != 'Implement AI Tools default architecture'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-tools-default-architecture
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Apply architecture patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def rep(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'missing pattern in {path}: {old[:100]!r}')
              p.write_text(s.replace(old, new, count))

          rep('src/lib/ai-model-registry.server.ts',
              'export type AiModelOperation = "generator" | "quality_check";',
              'export type AiModelOperation = "generator" | "quality_check" | "ai_tools";')
          rep('src/lib/ai-model-registry.server.ts',
              '  if (operation === "generator") {\n    return model.generatorCompatible && model.generatorEnabled;\n  }\n  return model.qualityCheckCompatible && model.qualityCheckEnabled;',
              '  if (operation === "quality_check") {\n    return model.qualityCheckCompatible && model.qualityCheckEnabled;\n  }\n  return model.generatorCompatible && model.generatorEnabled;')
          rep('src/lib/ai-model-registry.server.ts',
              '  const value =\n    operation === "generator" ? model.generatorReasoningEffort : model.qualityCheckReasoningEffort;',
              '  const value =\n    operation === "quality_check"\n      ? model.qualityCheckReasoningEffort\n      : model.generatorReasoningEffort;')
          rep('src/lib/ai-model-registry.server.ts',
              'const settingKeyFor = (operation: AiModelOperation) =>\n  operation === "generator" ? "ai_generator_default_model" : "ai_quality_check_default_model";',
              'const settingKeyFor = (operation: AiModelOperation) => {\n  if (operation === "generator") return "ai_generator_default_model";\n  if (operation === "quality_check") return "ai_quality_check_default_model";\n  return "ai_tools_default_model";\n};')

          rep('src/lib/ai-provider.server.ts',
              'for (const key of ["ai_model", "ai_generator_default_model", "ai_quality_check_default_model"]) {',
              'for (const key of [\n    "ai_model",\n    "ai_generator_default_model",\n    "ai_quality_check_default_model",\n    "ai_tools_default_model",\n  ]) {')

          p = Path('src/lib/ai-model-admin.functions.ts')
          s = p.read_text()
          s = s.replace('const [{ data: rows, error }, generatorDefault, qualityDefault] = await Promise.all([',
                        'const [{ data: rows, error }, generatorDefault, qualityDefault, aiToolsDefault] = await Promise.all([', 1)
          s = s.replace('      readDefaultModel(supabaseAdmin, "ai_quality_check_default_model"),\n    ]);',
                        '      readDefaultModel(supabaseAdmin, "ai_quality_check_default_model"),\n      readDefaultModel(supabaseAdmin, "ai_tools_default_model"),\n    ]);', 1)
          s = s.replace('      qualityDefault,\n    };', '      qualityDefault,\n      aiToolsDefault,\n    };', 1)
          s = s.replace('const [generatorDefault, qualityDefault] = await Promise.all([\n      readDefaultModel(supabaseAdmin, "ai_generator_default_model"),\n      readDefaultModel(supabaseAdmin, "ai_quality_check_default_model"),\n    ]);',
                        'const [generatorDefault, qualityDefault, aiToolsDefault] = await Promise.all([\n      readDefaultModel(supabaseAdmin, "ai_generator_default_model"),\n      readDefaultModel(supabaseAdmin, "ai_quality_check_default_model"),\n      readDefaultModel(supabaseAdmin, "ai_tools_default_model"),\n    ]);', 1)
          s = s.replace('    const isGeneratorDefault = row.provider_model_id === generatorDefault;\n    const isQualityDefault = row.provider_model_id === qualityDefault;',
                        '    const isGeneratorDefault = row.provider_model_id === generatorDefault;\n    const isQualityDefault = row.provider_model_id === qualityDefault;\n    const isAiToolsDefault = row.provider_model_id === aiToolsDefault;', 1)
          s = s.replace('      isGeneratorDefault &&\n      (data.status !== "enabled" || !data.generatorEnabled || !row.generator_compatible);',
                        '      (isGeneratorDefault || isAiToolsDefault) &&\n      (data.status !== "enabled" || !data.generatorEnabled || !row.generator_compatible);', 1)
          s = s.replace('      (isGeneratorDefault || isQualityDefault) && data.accessPolicy !== "all_users";',
                        '      (isGeneratorDefault || isQualityDefault || isAiToolsDefault) &&\n      data.accessPolicy !== "all_users";', 1)
          s = s.replace('    if (disablingGenerator)\n      throw new Error("Select another Generator default before disabling this model.");',
                        '    if (disablingGenerator)\n      throw new Error(\n        isAiToolsDefault && !isGeneratorDefault\n          ? "Select another AI Tools default before disabling this model."\n          : "Select another Generator default before disabling this model.",\n      );', 1)
          s = s.replace('      const usedBy =\n        isGeneratorDefault && isQualityDefault\n          ? "Generator and Quality Check"\n          : isGeneratorDefault\n            ? "Generator"\n            : "Quality Check";',
                        '      const usedBy = [\n        isGeneratorDefault ? "Generator" : null,\n        isQualityDefault ? "Quality Check" : null,\n        isAiToolsDefault ? "AI Tools" : null,\n      ]\n        .filter(Boolean)\n        .join(", ");', 1)
          s = s.replace('  operation: z.enum(["generator", "quality_check"]),',
                        '  operation: z.enum(["generator", "quality_check", "ai_tools"]),', 1)
          s = s.replace('    const valid =\n      data.operation === "generator"\n        ? model.status === "enabled" &&\n          model.generator_compatible === true &&\n          model.generator_enabled === true\n        : model.status === "enabled" &&\n          model.quality_check_compatible === true &&\n          model.quality_check_enabled === true;',
                        '    const valid =\n      data.operation === "quality_check"\n        ? model.status === "enabled" &&\n          model.quality_check_compatible === true &&\n          model.quality_check_enabled === true\n        : model.status === "enabled" &&\n          model.generator_compatible === true &&\n          model.generator_enabled === true;', 1)
          s = s.replace('    const key =\n      data.operation === "generator"\n        ? "ai_generator_default_model"\n        : "ai_quality_check_default_model";',
                        '    const key =\n      data.operation === "generator"\n        ? "ai_generator_default_model"\n        : data.operation === "quality_check"\n          ? "ai_quality_check_default_model"\n          : "ai_tools_default_model";', 1)
          p.write_text(s)

          p = Path('src/components/promptbeats/AiModelsPanel.tsx')
          s = p.read_text()
          s = s.replace('  const [qualityDefault, setQualityDefault] = useState("");',
                        '  const [qualityDefault, setQualityDefault] = useState("");\n  const [aiToolsDefault, setAiToolsDefault] = useState("");', 1)
          s = s.replace('    setQualityDefault(data.qualityDefault ?? "");',
                        '    setQualityDefault(data.qualityDefault ?? "");\n    setAiToolsDefault(data.aiToolsDefault ?? "");', 1)
          s = s.replace('    mutationFn: (input: { operation: "generator" | "quality_check"; model: string }) =>',
                        '    mutationFn: (input: {\n      operation: "generator" | "quality_check" | "ai_tools";\n      model: string;\n    }) =>', 1)
          s = s.replace('  const qualityOptions = useMemo(', '  const aiToolsOptions = generatorOptions;\n  const qualityOptions = useMemo(', 1)
          s = s.replace('<div className="grid gap-3 lg:grid-cols-2">', '<div className="grid gap-3 lg:grid-cols-3">', 1)
          marker = '''        <div className="glass rounded-2xl p-4">\n          <div className="flex items-center gap-2 text-sm font-semibold">\n            <ShieldCheck className="h-4 w-4 text-primary" />\n            {t("aiModels.qualityDefault")}'''
          idx = s.find(marker)
          if idx < 0: raise SystemExit('missing quality card marker')
          card = '''        <div className="glass rounded-2xl p-4">\n          <div className="flex items-center gap-2 text-sm font-semibold">\n            <Cpu className="h-4 w-4 text-primary" />\n            {t("aiModels.aiToolsDefault")}\n          </div>\n          <div className="mt-3 flex gap-2">\n            <select value={aiToolsDefault} onChange={(e) => setAiToolsDefault(e.target.value)} className="min-w-0 flex-1 rounded-xl border border-white/10 bg-[#17131f] px-3 py-2 text-sm">\n              {aiToolsOptions.map((m) => (<option key={m.id} value={m.providerModelId}>{m.displayName}</option>))}\n            </select>\n            <button disabled={!aiToolsDefault || setDefault.isPending} onClick={() => setDefault.mutate({ operation: "ai_tools", model: aiToolsDefault })} className="rounded-xl bg-primary px-3 py-2 text-xs font-semibold text-primary-foreground disabled:opacity-50">\n              {t("aiModels.saveDefault")}\n            </button>\n          </div>\n        </div>\n'''
          p.write_text(s[:idx] + card + s[idx:])

          rep('src/i18n/locales/en-ai-models.ts', '  "aiModels.qualityDefault": "Quality Check default",', '  "aiModels.qualityDefault": "Quality Check default",\n  "aiModels.aiToolsDefault": "AI Tools default",')
          rep('src/i18n/locales/el-ai-models.ts', '  "aiModels.qualityDefault": "Προεπιλογή Quality Check",', '  "aiModels.qualityDefault": "Προεπιλογή Quality Check",\n  "aiModels.aiToolsDefault": "Προεπιλογή AI Tools",')

          p = Path('src/lib/ai.functions.ts')
          s = p.read_text()
          s = s.replace('    const [generatorResult, qualityResult] = await Promise.allSettled([\n      getEffectiveModelAccess(context.userId, "generator"),\n      getEffectiveModelAccess(context.userId, "quality_check"),\n    ]);',
                        '    const [generatorResult, qualityResult, aiToolsResult] = await Promise.allSettled([\n      getEffectiveModelAccess(context.userId, "generator"),\n      getEffectiveModelAccess(context.userId, "quality_check"),\n      getEffectiveModelAccess(context.userId, "ai_tools"),\n    ]);', 1)
          s = s.replace('      qualityCheck: qualityResult.status === "fulfilled" ? qualityResult.value : emptyAccess(),\n    };',
                        '      qualityCheck: qualityResult.status === "fulfilled" ? qualityResult.value : emptyAccess(),\n      aiTools: aiToolsResult.status === "fulfilled" ? aiToolsResult.value : emptyAccess(),\n    };', 1)
          p.write_text(s)

          p = Path('src/lib/story-map-ai.functions.ts')
          p.write_text(p.read_text().replace('getEffectiveModelAccess(userId, "generator")', 'getEffectiveModelAccess(userId, "ai_tools")', 1))
          rep('src/lib/inspiration-wall-ai.functions.ts', 'getEffectiveModelAccess(userId, "generator")', 'getEffectiveModelAccess(userId, "ai_tools")')

          p = Path('src/lib/song-setup-assistant.functions.ts')
          s = p.read_text()
          s = s.replace('export const SONG_SETUP_ASSISTANT_MODEL = "gemini-3.8-flash" as const;\n\n', '', 1)
          s = s.replace('  targetPlatform: z.enum([...AI_TARGET_PLATFORMS] as [AITargetPlatform, ...AITargetPlatform[]]),\n});',
                        '  targetPlatform: z.enum([...AI_TARGET_PLATFORMS] as [AITargetPlatform, ...AITargetPlatform[]]),\n  model: z.string().trim().min(1).max(240).optional(),\n});', 1)
          s = s.replace('    const { modelCaller, providerOf } = await import("@/lib/ai-provider.server");\n    const { recordAiUsage } = await import("@/lib/ai-usage.server");\n    const caller = modelCaller(SONG_SETUP_ASSISTANT_MODEL);\n    const provider = providerOf(SONG_SETUP_ASSISTANT_MODEL);',
                        '    const { modelCaller, resolveAiModelForUser } = await import("@/lib/ai-provider.server");\n    const { recordAiUsage } = await import("@/lib/ai-usage.server");\n    const resolved = await resolveAiModelForUser(context.userId, "ai_tools", data.model);\n    const caller = modelCaller(resolved.model, resolved.provider);\n    const provider = resolved.provider;', 1)
          s = s.replace('      return { setup, model: SONG_SETUP_ASSISTANT_MODEL };', '      return { setup, model: result.model };', 1)
          s = s.replace('          model: SONG_SETUP_ASSISTANT_MODEL,', '          model: resolved.model,', 1)
          p.write_text(s)

          rep('src/lib/inspiration-wall-phase3.test.ts', 'getEffectiveModelAccess(userId, "generator")', 'getEffectiveModelAccess(userId, "ai_tools")')

          Path('supabase/migrations/20260923222500_ai_tools_default_model.sql').write_text('''-- Third canonical AI default category: AI Tools.\nINSERT INTO public.app_settings(key, value, updated_at, updated_by)\nSELECT 'ai_tools_default_model',\n       COALESCE((SELECT value FROM public.app_settings WHERE key='ai_generator_default_model'),\n                (SELECT value FROM public.app_settings WHERE key='ai_model'),\n                '{"model":"gemini-3.8-flash"}'::jsonb),\n       now(), NULL\nWHERE NOT EXISTS (SELECT 1 FROM public.app_settings WHERE key='ai_tools_default_model');\n''')

          Path('src/lib/ai-tools-default-architecture.test.ts').write_text('''import { describe, expect, test } from "bun:test";\n\nasync function source(path: string) { return Bun.file(path).text(); }\n\ndescribe("AI Tools default architecture", () => {\n  test("registry has three canonical operation buckets", async () => {\n    const registry = await source("src/lib/ai-model-registry.server.ts");\n    expect(registry).toContain('"generator" | "quality_check" | "ai_tools"');\n    expect(registry).toContain('return "ai_tools_default_model"');\n  });\n  test("Admin reads and writes AI Tools default", async () => {\n    const admin = await source("src/lib/ai-model-admin.functions.ts");\n    const panel = await source("src/components/promptbeats/AiModelsPanel.tsx");\n    expect(admin).toContain('readDefaultModel(supabaseAdmin, "ai_tools_default_model")');\n    expect(admin).toContain('z.enum(["generator", "quality_check", "ai_tools"])');\n    expect(panel).toContain('t("aiModels.aiToolsDefault")');\n    expect(panel).toContain('operation: "ai_tools"');\n  });\n  test("standalone AI tools use AI Tools default while Generator remains Generator-owned", async () => {\n    const story = await source("src/lib/story-map-ai.functions.ts");\n    const wall = await source("src/lib/inspiration-wall-ai.functions.ts");\n    const setup = await source("src/lib/song-setup-assistant.functions.ts");\n    const generator = await source("src/lib/generation-jobs.functions.ts");\n    expect(story).toContain('getEffectiveModelAccess(userId, "ai_tools")');\n    expect(wall).toContain('getEffectiveModelAccess(userId, "ai_tools")');\n    expect(setup).toContain('resolveAiModelForUser(context.userId, "ai_tools", data.model)');\n    expect(setup).not.toContain('SONG_SETUP_ASSISTANT_MODEL');\n    expect(generator).toContain('getModelForUser(context.userId, data.generationModel ?? undefined, "generator")');\n  });\n  test("model access payload exposes AI Tools options", async () => {\n    const ai = await source("src/lib/ai.functions.ts");\n    expect(ai).toContain('getEffectiveModelAccess(context.userId, "ai_tools")');\n    expect(ai).toContain('aiTools: aiToolsResult.status === "fulfilled"');\n  });\n});\n''')
          PY
          bunx prettier --write src/lib/ai-model-registry.server.ts src/lib/ai-provider.server.ts src/lib/ai-model-admin.functions.ts src/components/promptbeats/AiModelsPanel.tsx src/i18n/locales/en-ai-models.ts src/i18n/locales/el-ai-models.ts src/lib/ai.functions.ts src/lib/story-map-ai.functions.ts src/lib/inspiration-wall-ai.functions.ts src/lib/song-setup-assistant.functions.ts src/lib/inspiration-wall-phase3.test.ts src/lib/ai-tools-default-architecture.test.ts
      - name: Validate
        run: |
          bun test src/lib/ai-tools-default-architecture.test.ts src/lib/story-map.test.ts src/lib/inspiration-wall-phase3.test.ts
          bun run lint
          bun run build
          bunx tsc --noEmit --pretty false
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src supabase/migrations/20260923222500_ai_tools_default_model.sql
          git commit -m 'Implement AI Tools default architecture' || exit 0
          git push origin ai-tools-default-architecture
