name: Story Map integrate v3

on:
  push:
    branches: [story-map-step1]

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.head_commit.message != 'Apply Story Map integration patches'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: story-map-step1
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Correct temporary integration script anchors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/story-map-integrate.py')
          s = p.read_text()
          s = s.replace(
              "button_anchor = '''            <button\n              onClick={generate}'''",
              "button_anchor = '''                <button\n                  onClick={generate}'''",
              1,
          )
          marker = '# Story Map result inspector before quality panel:'
          if marker not in s:
              raise SystemExit('result patch marker not found')
          s = s[:s.index(marker)] + r'''# Story Map result inspector inside the completed result card.
result_anchor = ''' + "'''" + '''          {!busy && result && (\n            <div className=\\"mt-6 space-y-4 pb-16\\">''' + "'''" + r'''
result_insert = ''' + "'''" + '''          {!busy && result && (\n            <div className=\\"mt-6 space-y-4 pb-16\\">\n              {storyDrivenDraft && (\n                <div className=\\"glass rounded-2xl p-4\\">\n                  <div className=\\"flex flex-wrap items-center justify-between gap-2\\">\n                    <div>\n                      <p className=\\"text-sm font-semibold\\">Story Map</p>\n                      <p className=\\"text-xs text-muted-foreground\\">{storyDrivenDraft.summary}</p>\n                    </div>\n                    <div className=\\"flex gap-2\\">\n                      <button type=\\"button\\" onClick={() => setStoryMapPreviewOpen((open) => !open)} className=\\"rounded-lg border border-white/10 px-3 py-1.5 text-xs text-accent\\">\n                        {storyMapPreviewOpen ? (appLanguage === \\"el\\" ? \\"Κλείσιμο Story Map\\" : \\"Hide Story Map\\") : (appLanguage === \\"el\\" ? \\"Προβολή Story Map\\" : \\"View Story Map\\")}\n                      </button>\n                      <button\n                        type=\\"button\\"\n                        disabled={storyMapSaved}\n                        onClick={() => void (async () => {\n                          try {\n                            const created = await createStoryMap({ data: {\n                              title: `${result.title || theme.trim()} — Story Map`,\n                              concept: theme.trim(),\n                              projectId: saveProjectId || null,\n                            }});\n                            await replaceStoryMapDraft({ data: { storyMapId: created.storyMap.id, draft: storyDrivenDraft } });\n                            setStoryMapSaved(true);\n                            setStatus(appLanguage === \\"el\\" ? \\"Το Story Map αποθηκεύτηκε.\\" : \\"Story Map saved.\\");\n                          } catch (cause) {\n                            setStatus(cause instanceof Error ? cause.message : \\"Could not save Story Map.\\");\n                          }\n                        })()}\n                        className=\\"rounded-lg border border-accent/35 px-3 py-1.5 text-xs text-accent disabled:opacity-40\\"\n                      >\n                        {storyMapSaved ? (appLanguage === \\"el\\" ? \\"Αποθηκεύτηκε\\" : \\"Saved\\") : (appLanguage === \\"el\\" ? \\"Αποθήκευση Story Map\\" : \\"Save Story Map\\")}\n                      </button>\n                    </div>\n                  </div>\n                  {storyMapPreviewOpen && (\n                    <div className=\\"mt-3 space-y-2\\">\n                      {storyDrivenDraft.beats.map((beat, index) => (\n                        <div key={`${beat.title}-${index}`} className=\\"rounded-xl border border-white/10 bg-black/20 p-3 text-xs\\">\n                          <span className=\\"font-semibold text-accent\\">{index + 1}. {beat.title}</span>\n                          {beat.whatHappens && <span className=\\"ml-2 text-muted-foreground\\">{beat.whatHappens}</span>}\n                        </div>\n                      ))}\n                    </div>\n                  )}\n                </div>\n              )}''' + "'''" + r'''
s = replace_once(s, result_anchor, result_insert, "story result inspector")
p.write_text(s)
print("Story Map integration patches applied")
'''
          p.write_text(s)
          PY
      - name: Apply integration patches
        run: python3 scripts/story-map-integrate.py
      - name: Build, format, lint and typecheck
        run: |
          bun run build
          bunx prettier --write src/components/promptbeats/AppShell.tsx src/components/promptbeats/LyricsWorkspace.tsx src/components/promptbeats/StoryMapLyricsPanel.tsx src/routes/story-map.tsx src/routes/generate.tsx src/lib/story-map.shared.ts src/lib/story-map.functions.ts src/lib/story-map-ai.functions.ts src/lib/story-map-workspace.functions.ts src/routeTree.gen.ts
          bun run lint
          bunx tsc --noEmit --pretty false
      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src
          if ! git diff --cached --quiet; then
            git commit -m 'Apply Story Map integration patches'
            git push origin story-map-step1
          fi
