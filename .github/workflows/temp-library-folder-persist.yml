name: Temporary library folder persistence patch

on:
  push:
    branches:
      - "fix/library-folder-refresh-persistence"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Patch library folder persistence
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch_library.py
          python /tmp/patch_library.py
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run folder regression test
        run: bun test src/lib/library-folders.test.ts
      - name: Commit patch and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/temp-library-folder-persist.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve library folder on refresh"
          git push origin HEAD:fix/library-folder-refresh-persistence
