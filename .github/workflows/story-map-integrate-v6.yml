name: Story Map integrate v6

on:
  push:
    branches: [story-map-step1]

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.head_commit.message != 'Apply Story Map integration v6'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: story-map-step1
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Fix integration escape
        run: python3 scripts/story-map-integrate-v4-fix.py
      - name: Apply Story Map integration patches
        run: python3 scripts/story-map-integrate-v4.py
      - name: Format patched sources before build
        run: bunx prettier --write src/components/promptbeats/AppShell.tsx src/components/promptbeats/LyricsWorkspace.tsx src/components/promptbeats/StoryMapLyricsPanel.tsx src/routes/story-map.tsx src/routes/generate.tsx src/lib/story-map.shared.ts src/lib/story-map.functions.ts src/lib/story-map-ai.functions.ts src/lib/story-map-workspace.functions.ts src/lib/ai-admission.server.ts src/lib/ai-usage.server.ts src/lib/feature-access.functions.ts
      - name: Build and generate route tree
        run: bun run build
      - name: Format generated route tree
        run: bunx prettier --write src/routeTree.gen.ts
      - name: Verify lint
        run: bun run lint
      - name: Verify strict TypeScript
        run: bunx tsc --noEmit --pretty false
      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src
          if ! git diff --cached --quiet; then
            git commit -m 'Apply Story Map integration v6'
            git push origin story-map-step1
          fi
