name: PB-007 temporary format pass
on:
  push:
    branches:
      - feat/pb-007-followup-ii-creator-home
    paths:
      - .github/workflows/pb007-format-once.yml
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Apply project Prettier to changed source files only
        run: bunx prettier --write src/routes/index.tsx src/routes/library.tsx src/routes/generate.tsx src/lib/home-creator-state.ts src/lib/home-creator-state.test.ts src/lib/pb007-followup-ii-route-contract.test.ts src/lib/library-tab-refresh-persistence.test.ts
      - name: Commit formatting-only changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/index.tsx src/routes/library.tsx src/routes/generate.tsx src/lib/home-creator-state.ts src/lib/home-creator-state.test.ts src/lib/pb007-followup-ii-route-contract.test.ts src/lib/library-tab-refresh-persistence.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(PB-007): apply Prettier to implementation files"
            git push
          fi
