name: One-shot football details formatting
on:
  push:
    paths:
      - .github/workflows/football-details-format-once.yml
permissions:
  contents: write
jobs:
  fix:
    if: github.ref == 'refs/heads/feature/football-research-results-redesign'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/football-research-results-redesign
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write src/routes/private/football-research.tsx src/lib/football-ai-research.functions.ts src/lib/football-ai-research.shared.ts src/lib/football-ai-research.shared.test.ts
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/private/football-research.tsx src/lib/football-ai-research.functions.ts src/lib/football-ai-research.shared.ts src/lib/football-ai-research.shared.test.ts
          if ! git diff --cached --quiet; then git commit -m "style: format detailed football research"; git push origin HEAD:feature/football-research-results-redesign; fi
