name: Inspiration Wall Phase 4 Integrate

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspiration-wall-phase4-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Integrate Phase 4
        run: |
          python3 scripts/inspiration-wall-phase4-integrate.py
          python3 scripts/inspiration-wall-phase4-lint-fix.py
      - name: Format
        run: bunx prettier --write src/components/promptbeats/InspirationWallDirectionPanel.tsx src/components/promptbeats/SongSetupAssistantModal.tsx src/routes/generate.tsx src/lib/inspiration-wall.functions.ts src/lib/inspiration-wall-song-setup.shared.ts src/lib/inspiration-wall-phase4.test.ts
      - name: Inspiration Wall tests
        run: bun test src/lib/inspiration-wall.test.ts src/lib/inspiration-wall-phase2.test.ts src/lib/inspiration-wall-phase3.test.ts src/lib/inspiration-wall-phase4.test.ts src/lib/feature-access-v2.test.ts
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build
      - name: Strict TypeScript
        run: bunx tsc --noEmit --pretty false
      - name: Commit Phase 4 source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/promptbeats/InspirationWallDirectionPanel.tsx src/components/promptbeats/SongSetupAssistantModal.tsx src/routes/generate.tsx src/lib/inspiration-wall.functions.ts src/lib/inspiration-wall-song-setup.shared.ts src/lib/inspiration-wall-phase4.test.ts
          if git diff --cached --quiet; then
            echo "No Phase 4 source changes required."
            exit 0
          fi
          git commit -m "Add Inspiration Wall Phase 4 Song Setup handoff"
          git push origin HEAD:main
