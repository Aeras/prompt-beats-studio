name: Song Universe validation

on:
  push:
    branches: [song-universe-step2]

permissions:
  contents: write

jobs:
  validate:
    if: github.event.head_commit.message != 'Record Song Universe TypeScript diagnostic'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: song-universe-step2
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Song Universe tests
        run: bun test src/lib/song-universe.test.ts
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build
      - name: Capture strict TypeScript
        run: |
          set +e
          bunx tsc --noEmit --pretty false > song-universe-tsc.txt 2>&1
          code=$?
          echo "tsc_exit=$code" >> song-universe-tsc.txt
          cat song-universe-tsc.txt
          exit 0
      - name: Commit TypeScript diagnostic
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add song-universe-tsc.txt
          git commit -m 'Record Song Universe TypeScript diagnostic' || exit 0
          git push origin song-universe-step2
