name: Song Universe validation

on:
  push:
    branches: [song-universe-step2]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Song Universe tests
        run: bun test src/lib/song-universe.test.ts
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build
      - name: Strict TypeScript
        run: bunx tsc --noEmit --pretty false
