name: Temporary AI health formatting

on:
  push:
    branches:
      - fix/ai-health-diagnostics

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ai-health-diagnostics
      - name: Ensure final newline
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/promptbeats/AiModelsPanel.tsx')
          s = p.read_text()
          p.write_text(s.rstrip('\n') + '\n')
          PY
      - name: Commit formatting if needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/promptbeats/AiModelsPanel.tsx
          git commit -m "Fix AI health panel formatting"
          git push origin HEAD:fix/ai-health-diagnostics
