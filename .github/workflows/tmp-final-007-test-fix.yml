name: Temporary FINAL-007 test fix

on:
  push:
    branches:
      - fix/final-007-upload-memory

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/final-007-upload-memory
      - name: Update upload gate assertion for bounded-body signature
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/feature-access-v2.test.ts')
          text = path.read_text()
          old = 'const bodyRead = api.indexOf("readBoundedBody(request)");'
          new = 'const bodyRead = api.indexOf("readBoundedBody(request, declaredLength)");'
          if old not in text:
              if new in text:
                  raise SystemExit(0)
              raise SystemExit('expected assertion not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit if needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/feature-access-v2.test.ts
          git commit -m "Update upload gate regression assertion"
          git push origin HEAD:fix/final-007-upload-memory
