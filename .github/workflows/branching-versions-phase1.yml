name: One-shot Branching Versions Phase 1

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Patch Branching Versions Phase 1
        run: |
          python .github/scripts/branching_versions_phase1.py
          python .github/scripts/branching_versions_phase1_tests.py
          python .github/scripts/branching_versions_phase1_types.py
          git checkout -- .github/workflows/regression-gate.yml

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Targeted regression tests
        run: bun test src/lib/branching-versions.test.ts src/lib/project-version-history-ui.test.ts src/lib/project-version-linked-tracks.test.ts src/lib/lyrics-review-integration.test.ts

      - name: Strict TypeScript check
        run: bunx tsc --noEmit --pretty false

      - name: Commit implementation
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "Aeras"
          git config user.email "4737202+Aeras@users.noreply.github.com"
          git add src/integrations/supabase/types.ts src/lib/ai.functions.ts src/lib/lyrics-review.functions.ts src/routes/lyrics-review.tsx src/components/promptbeats/ProjectVersionHistory.tsx src/lib/branching-versions.test.ts src/lib/lyrics-review-integration.test.ts src/lib/project-version-linked-tracks.test.ts supabase/migrations/20260923150000_branching_versions_phase1.sql
          git commit -m "Add Branching Versions Phase 1"
          git push origin main
