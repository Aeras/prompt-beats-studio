name: One-shot Branching Versions Phase 1

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Patch Branching Versions Phase 1
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # 1) Migration: optional branch label + branch-aware leaf replacement.
          migration = Path('supabase/migrations/20260923150000_branching_versions_phase1.sql')
          migration.write_text(r'''BEGIN;

ALTER TABLE public.saved_prompts
  ADD COLUMN IF NOT EXISTS branch_label text;

DO $$
BEGIN
  IF NOT EXISTS (
    SELECT 1 FROM pg_constraint
    WHERE conname = 'saved_prompts_branch_label_length_check'
      AND conrelid = 'public.saved_prompts'::regclass
  ) THEN
    ALTER TABLE public.saved_prompts
      ADD CONSTRAINT saved_prompts_branch_label_length_check
      CHECK (branch_label IS NULL OR char_length(branch_label) <= 120);
  END IF;
END $$;

CREATE INDEX IF NOT EXISTS saved_prompts_project_parent_idx
  ON public.saved_prompts(project_id, parent_prompt_id)
  WHERE project_id IS NOT NULL;

CREATE OR REPLACE FUNCTION public.replace_latest_prompt_lyrics_review_version(
  _user_id uuid,
  _project_id uuid,
  _version_prompt_id uuid,
  _lyrics text,
  _version_change_metadata jsonb
)
RETURNS jsonb
LANGUAGE plpgsql
SECURITY DEFINER
SET search_path = public, pg_temp
AS $$
DECLARE
  v_target public.saved_prompts;
BEGIN
  IF _lyrics IS NULL OR char_length(_lyrics) = 0 OR char_length(_lyrics) > 12000 THEN
    RAISE EXCEPTION 'Lyrics are required and must be 12000 characters or fewer';
  END IF;
  IF _version_change_metadata IS NULL OR jsonb_typeof(_version_change_metadata) <> 'object' THEN
    RAISE EXCEPTION 'Version change metadata is required';
  END IF;

  IF NOT EXISTS (
    SELECT 1 FROM public.prompt_projects p
    WHERE p.id = _project_id AND p.user_id = _user_id
  ) THEN
    RAISE EXCEPTION 'Prompt project does not belong to this user';
  END IF;

  PERFORM pg_advisory_xact_lock(hashtext(_project_id::text));

  SELECT * INTO v_target
  FROM public.saved_prompts sp
  WHERE sp.id = _version_prompt_id
    AND sp.user_id = _user_id
    AND sp.project_id = _project_id
  FOR UPDATE;

  IF NOT FOUND THEN
    RAISE EXCEPTION 'Version does not belong to this user/project';
  END IF;

  IF EXISTS (
    SELECT 1
    FROM public.saved_prompts child
    WHERE child.user_id = _user_id
      AND child.project_id = _project_id
      AND child.parent_prompt_id = _version_prompt_id
  ) THEN
    RAISE EXCEPTION 'Only a leaf project version can be replaced';
  END IF;

  PERFORM set_config('promptbeats.allow_version_metadata_update', 'lyrics_review_latest', true);

  UPDATE public.saved_prompts
  SET lyrics = _lyrics,
      version_change_metadata = _version_change_metadata
  WHERE id = _version_prompt_id
    AND user_id = _user_id
    AND project_id = _project_id;

  PERFORM set_config('promptbeats.allow_version_metadata_update', '', true);

  UPDATE public.prompt_projects
  SET updated_at = now()
  WHERE id = _project_id AND user_id = _user_id;

  RETURN jsonb_build_object(
    'id', v_target.id,
    'project_id', v_target.project_id,
    'version_number', v_target.version_number,
    'parent_prompt_id', v_target.parent_prompt_id,
    'replaced', true
  );
END;
$$;

REVOKE ALL ON FUNCTION public.replace_latest_prompt_lyrics_review_version(
  uuid, uuid, uuid, text, jsonb
) FROM PUBLIC, anon, authenticated;
GRANT EXECUTE ON FUNCTION public.replace_latest_prompt_lyrics_review_version(
  uuid, uuid, uuid, text, jsonb
) TO service_role;

COMMIT;
''')

          # 2) ai.functions: expose branch_label and a narrowly scoped updater.
          ai = Path('src/lib/ai.functions.ts')
          text = ai.read_text()
          old_select = '"id, title, custom_name, version_number, version_label, parent_prompt_id, version_change_metadata, version_user_note, created_at"'
          new_select = '"id, title, custom_name, version_number, version_label, parent_prompt_id, branch_label, version_change_metadata, version_user_note, created_at"'
          if old_select in text:
            text = text.replace(old_select, new_select, 1)
          elif new_select not in text:
            raise SystemExit('Project version history select not found')

          marker = 'export const listProjectVersionHistory = createServerFn({ method: "POST" })'
          updater = r'''
export const updateVersionBranchLabel = createServerFn({ method: "POST" })
  .middleware([requireSupabaseAuth])
  .inputValidator((input: unknown) =>
    z.object({ id: z.string().uuid(), label: z.string().max(120) }).parse(input),
  )
  .handler(async ({ data, context }) => {
    const label = data.label.trim() || null;
    const { data: updated, error } = await (context.supabase.from("saved_prompts") as any)
      .update({ branch_label: label })
      .eq("id", data.id)
      .eq("user_id", context.userId)
      .select("id, project_id, branch_label")
      .maybeSingle();
    if (error) throw new Error(error.message);
    if (!updated) throw new Error("Version not found.");
    return { id: updated.id, projectId: updated.project_id, branchLabel: updated.branch_label };
  });

'''
          if 'export const updateVersionBranchLabel' not in text:
            idx = text.find(marker)
            if idx < 0:
              raise SystemExit('listProjectVersionHistory marker not found')
            text = text[:idx] + updater + text[idx:]
          ai.write_text(text)

          # 3) Lyrics Review context: a replaceable version is a leaf of its branch, not globally last.
          lr = Path('src/lib/lyrics-review.functions.ts')
          text = lr.read_text()
          text = text.replace(
            '  generator_input_snapshot: z.unknown().nullable(),\n  created_at: z.string(),',
            '  generator_input_snapshot: z.unknown().nullable(),\n  parent_prompt_id: z.string().uuid().nullable(),\n  created_at: z.string(),',
          )
          text = text.replace(
            '"id, version_number, version_label, custom_name, title, theme, genre, mood, language, tags, lyrics, note, generator_input_snapshot, created_at"',
            '"id, version_number, version_label, custom_name, title, theme, genre, mood, language, tags, lyrics, note, generator_input_snapshot, parent_prompt_id, created_at"',
          )
          text = text.replace('    const latest = versions.at(-1)!;\n', '    const parentIds = new Set(versions.map((version) => version.parent_prompt_id).filter(Boolean));\n')
          text = text.replace(
            '        isLatest: selected.id === latest.id,',
            '        isLatest: selected.id === versions.at(-1)!.id,\n        isLeaf: !parentIds.has(selected.id),',
          )
          text = text.replace(
            'if (error.message.includes("Only the latest project version")) {\n          throw new Error("Only the latest Project version can be replaced.");\n        }',
            'if (error.message.includes("Only a leaf project version")) {\n          throw new Error("Only the latest version of the selected branch can be replaced.");\n        }',
          )
          lr.write_text(text)

          # 4) Lyrics Review route: expose replace only for a branch leaf.
          route = Path('src/routes/lyrics-review.tsx')
          text = route.read_text().replace('selectedProject.isLatest', 'selectedProject.isLeaf')
          route.write_text(text)

          # 5) Project Version History UI: branch structure, labels, and continue-from-any-version action.
          ui = Path('src/components/promptbeats/ProjectVersionHistory.tsx')
          text = ui.read_text()
          text = text.replace(
            'import { Check, ChevronDown, GitCompareArrows, Loader2, NotebookPen, Star, X } from "lucide-react";',
            'import { Check, ChevronDown, GitBranch, GitCompareArrows, Loader2, NotebookPen, Star, X } from "lucide-react";',
          )
          text = text.replace(
            '  updateVersionUserNote,\n} from "@/lib/ai.functions";',
            '  updateVersionBranchLabel,\n  updateVersionUserNote,\n} from "@/lib/ai.functions";',
          )
          state_anchor = '  const [privateReviewOpen, setPrivateReviewOpen] = useState(false);\n'
          state_block = state_anchor + '  const [branchLabelEditingId, setBranchLabelEditingId] = useState<string | null>(null);\n  const [branchLabelDraft, setBranchLabelDraft] = useState("");\n  const [branchLabelBusy, setBranchLabelBusy] = useState(false);\n'
          if state_anchor in text and 'branchLabelEditingId' not in text:
            text = text.replace(state_anchor, state_block, 1)

          version_anchor = '  const preferredId = history.data?.project.preferred_prompt_id ?? null;\n'
          maps_block = version_anchor + r'''

  const versionById = useMemo(
    () => new Map(versions.map((version) => [version.id, version])),
    [versions],
  );
  const branchShape = useMemo(() => {
    const childCount = new Map<string, number>();
    const depth = new Map<string, number>();
    for (const version of versions) {
      if (version.parent_prompt_id) {
        childCount.set(version.parent_prompt_id, (childCount.get(version.parent_prompt_id) ?? 0) + 1);
      }
    }
    const resolveDepth = (id: string, seen = new Set<string>()): number => {
      if (depth.has(id)) return depth.get(id)!;
      if (seen.has(id)) return 0;
      seen.add(id);
      const current = versionById.get(id);
      const value = current?.parent_prompt_id && versionById.has(current.parent_prompt_id)
        ? Math.min(resolveDepth(current.parent_prompt_id, seen) + 1, 4)
        : 0;
      depth.set(id, value);
      return value;
    };
    for (const version of versions) resolveDepth(version.id);
    return { childCount, depth };
  }, [versionById, versions]);
'''
          if version_anchor in text and 'const branchShape = useMemo' not in text:
            text = text.replace(version_anchor, maps_block, 1)

          toggle_anchor = '  const togglePreferred = async (versionId: string) => {'
          save_branch = r'''  const saveBranchLabel = async (versionId: string) => {
    if (branchLabelBusy) return;
    setBranchLabelBusy(true);
    try {
      await updateVersionBranchLabel({ data: { id: versionId, label: branchLabelDraft } });
      await queryClient.invalidateQueries({ queryKey: ["project-version-history", projectId] });
      setBranchLabelEditingId(null);
    } finally {
      setBranchLabelBusy(false);
    }
  };

'''
          if toggle_anchor in text and 'const saveBranchLabel' not in text:
            text = text.replace(toggle_anchor, save_branch + toggle_anchor, 1)

          loop_anchor = '                const isNoteEditing = noteEditingId === version.id;\n'
          loop_extra = loop_anchor + '''                const parent = version.parent_prompt_id ? versionById.get(version.parent_prompt_id) ?? null : null;\n                const parentVersionLabel = parent ? `V${parent.version_number ?? "?"}` : null;\n                const siblingCount = parent ? branchShape.childCount.get(parent.id) ?? 0 : 0;\n                const isAlternateBranch = siblingCount > 1;\n                const branchDepth = branchShape.depth.get(version.id) ?? 0;\n                const isBranchLabelEditing = branchLabelEditingId === version.id;\n'''
          if loop_anchor in text and 'const isAlternateBranch' not in text:
            text = text.replace(loop_anchor, loop_extra, 1)

          article_anchor = '                    className={cn(\n                      "rounded-xl border p-3",'
          article_new = '                    style={{ marginLeft: `${Math.min(branchDepth, 3) * 12}px` }}\n                    className={cn(\n                      "rounded-xl border p-3",'
          if article_anchor in text and 'Math.min(branchDepth' not in text:
            text = text.replace(article_anchor, article_new, 1)

          linked_anchor = '''                          {version.linked_track_count > 0 && (\n                            <span className="rounded-full border border-accent/20 bg-accent/[0.04] px-2 py-0.5 text-[10px] font-semibold text-accent">\n                              🎵 {version.linked_track_count}\n                            </span>\n                          )}'''
          branch_badges = linked_anchor + r'''
                          {parentVersionLabel && (
                            <span className="inline-flex items-center gap-1 rounded-full border border-white/10 px-2 py-0.5 text-[10px] text-muted-foreground">
                              <GitBranch className="h-3 w-3" />
                              {el ? `από ${parentVersionLabel}` : `from ${parentVersionLabel}`}
                            </span>
                          )}
                          {isAlternateBranch && (
                            <span className="rounded-full border border-accent/25 bg-accent/[0.04] px-2 py-0.5 text-[10px] font-semibold text-accent">
                              {el ? "Εναλλακτική κατεύθυνση" : "Alternate direction"}
                            </span>
                          )}
                          {version.branch_label && (
                            <span className="rounded-full border border-white/10 px-2 py-0.5 text-[10px] font-semibold text-foreground/80">
                              {version.branch_label}
                            </span>
                          )}'''
          if linked_anchor in text and 'Alternate direction' not in text:
            text = text.replace(linked_anchor, branch_badges, 1)

          open_button = '''                        <button\n                          type="button"\n                          onClick={() => {\n                            setOpenVersionId(version.id);'''
          # Insert the continue link immediately before the Open Version button.
          if open_button in text and 'Continue from this Version' not in text:
            continue_link = '''                        <Link\n                          to="/generate"\n                          search={{ mode: "revision", project: projectId, base: version.id }}\n                          className="inline-flex items-center gap-1 rounded-lg border border-accent/25 px-2.5 py-1.5 text-[11px] font-semibold text-accent hover:bg-accent/5"\n                        >\n                          <GitBranch className="h-3.5 w-3.5" />\n                          {el ? "Συνέχεια από αυτή" : "Continue from this Version"}\n                        </Link>\n'''
            text = text.replace(open_button, continue_link + open_button, 1)

          note_button = '''                        <button\n                          type="button"\n                          onClick={() => {\n                            setNoteEditingId(isNoteEditing ? null : version.id);'''
          if note_button in text and 'setBranchLabelEditingId' not in text[text.find('return ('):]:
            branch_button = '''                        <button\n                          type="button"\n                          onClick={() => {\n                            setBranchLabelEditingId(isBranchLabelEditing ? null : version.id);\n                            setBranchLabelDraft(version.branch_label ?? "");\n                          }}\n                          className="rounded-lg border border-white/10 p-1.5 text-muted-foreground hover:text-accent"\n                          aria-label={el ? "Ετικέτα κατεύθυνσης" : "Branch label"}\n                        >\n                          <GitBranch className="h-3.5 w-3.5" />\n                        </button>\n'''
            text = text.replace(note_button, branch_button + note_button, 1)

          user_request_anchor = '                    {metadata?.userRequest && (\n'
          if user_request_anchor in text and 'isBranchLabelEditing &&' not in text:
            branch_editor = r'''                    {isBranchLabelEditing && (
                      <div className="mt-3 flex flex-col gap-2 rounded-lg border border-white/10 bg-black/20 p-2.5 sm:flex-row sm:items-center">
                        <input
                          value={branchLabelDraft}
                          onChange={(event) => setBranchLabelDraft(event.target.value.slice(0, 120))}
                          maxLength={120}
                          placeholder={el ? "π.χ. Πιο εμπορικό chorus" : "e.g. More commercial chorus"}
                          className="min-w-0 flex-1 rounded-lg border border-white/10 bg-black/25 px-3 py-2 text-xs outline-none focus:border-accent/40"
                        />
                        <div className="flex gap-2">
                          <button
                            type="button"
                            onClick={() => saveBranchLabel(version.id)}
                            disabled={branchLabelBusy}
                            className="rounded-lg bg-accent px-3 py-2 text-[11px] font-semibold text-accent-foreground disabled:opacity-50"
                          >
                            {branchLabelBusy ? <Loader2 className="h-3.5 w-3.5 animate-spin" /> : el ? "Αποθήκευση" : "Save"}
                          </button>
                          <button
                            type="button"
                            onClick={() => setBranchLabelEditingId(null)}
                            className="rounded-lg border border-white/10 px-3 py-2 text-[11px] text-muted-foreground"
                          >
                            {el ? "Άκυρο" : "Cancel"}
                          </button>
                        </div>
                      </div>
                    )}

'''
            text = text.replace(user_request_anchor, branch_editor + user_request_anchor, 1)

          ui.write_text(text)

          # 6) Regression test for the new contract.
          test = Path('src/lib/branching-versions.test.ts')
          test.write_text(r'''import { describe, expect, test } from "bun:test";
import { readFile } from "node:fs/promises";
import { join } from "node:path";

const root = process.cwd();
const source = (path: string) => readFile(join(root, path), "utf8");

describe("Branching Versions Phase 1", () => {
  test("stores an optional branch label and preserves parent/child indexing", async () => {
    const sql = await source("supabase/migrations/20260923150000_branching_versions_phase1.sql");
    expect(sql).toContain("ADD COLUMN IF NOT EXISTS branch_label text");
    expect(sql).toContain("saved_prompts_project_parent_idx");
    expect(sql).toContain("parent_prompt_id = _version_prompt_id");
    expect(sql).toContain("Only a leaf project version can be replaced");
  });

  test("history exposes branching without changing canonical V numbers", async () => {
    const history = await source("src/components/promptbeats/ProjectVersionHistory.tsx");
    const server = await source("src/lib/ai.functions.ts");
    expect(server).toContain("branch_label");
    expect(server).toContain("updateVersionBranchLabel");
    expect(history).toContain("Continue from this Version");
    expect(history).toContain("Alternate direction");
    expect(history).toContain("branchShape.childCount");
    expect(history).toContain('search={{ mode: "revision", project: projectId, base: version.id }}');
    expect(history).toContain("`V${version.version_number ?? index + 1}`");
  });

  test("Lyrics Review replacement follows the selected branch leaf", async () => {
    const server = await source("src/lib/lyrics-review.functions.ts");
    const route = await source("src/routes/lyrics-review.tsx");
    expect(server).toContain("isLeaf: !parentIds.has(selected.id)");
    expect(route).toContain("!selectedProject.isLeaf");
  });
});
''')

          # 7) Make regression gate permanent.
          gate = Path('.github/workflows/regression-gate.yml')
          text = gate.read_text()
          if 'Branching Versions tests' not in text:
            anchor = '      - name: Project Version History UI tests\n        run: bun test src/lib/project-version-history-ui.test.ts\n'
            block = anchor + '\n      - name: Branching Versions tests\n        run: bun test src/lib/branching-versions.test.ts\n'
            if anchor not in text:
              raise SystemExit('Regression gate Project Version History anchor not found')
            text = text.replace(anchor, block, 1)
          gate.write_text(text)
          PY

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Branching Versions tests
        run: bun test src/lib/branching-versions.test.ts src/lib/project-version-history-ui.test.ts src/lib/project-version-linked-tracks.test.ts src/lib/lyrics-review-integration.test.ts

      - name: Strict TypeScript check
        run: bunx tsc --noEmit --pretty false

      - name: Commit implementation
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "Aeras"
          git config user.email "4737202+Aeras@users.noreply.github.com"
          git add src/lib/ai.functions.ts src/lib/lyrics-review.functions.ts src/routes/lyrics-review.tsx src/components/promptbeats/ProjectVersionHistory.tsx src/lib/branching-versions.test.ts supabase/migrations/20260923150000_branching_versions_phase1.sql .github/workflows/regression-gate.yml
          git commit -m "Add Branching Versions Phase 1"
          git push origin main
