name: Temporary Mobile Header Formatting

on:
  push:
    branches:
      - feat/mobile-header-redesign

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mobile-header-redesign
      - name: Fix formatting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/index.tsx')
          s = p.read_text()
          old = '<span className="truncate font-display text-base font-bold md:text-lg">{t("nav.feedShort")}</span>'
          new = '<span className="truncate font-display text-base font-bold md:text-lg">\n        {t("nav.feedShort")}\n      </span>'
          if old not in s:
              raise SystemExit('format target not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/index.tsx
          git commit -m "Format mobile feed header"
          git push origin HEAD:feat/mobile-header-redesign
