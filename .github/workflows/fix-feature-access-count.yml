name: Fix Feature Access count

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message != 'Update Feature Access V2 canonical count'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Update canonical feature count
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/lib/feature-access-v2.test.ts')
          s = p.read_text()
          s = s.replace('  "story_map",\n  "export_center",', '  "story_map",\n  "song_universe",\n  "export_center",')
          s = s.replace('describe("Feature Access V2 — 19 features", () => {', 'describe("Feature Access V2 — 20 features", () => {')
          s = s.replace('test("canonical TypeScript registry contains exactly 19 unique feature keys", async () => {', 'test("canonical TypeScript registry contains exactly 20 unique feature keys", async () => {')
          s = s.replace('expect(new Set(keys).size).toBe(19);', 'expect(new Set(keys).size).toBe(20);')
          s = s.replace('      "story_map",\n      "lyrics_review",', '      "story_map",\n      "song_universe",\n      "lyrics_review",')
          p.write_text(s)
          PY
          bunx prettier --write src/lib/feature-access-v2.test.ts
          bun test src/lib/feature-access-v2.test.ts
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/lib/feature-access-v2.test.ts
          git commit -m 'Update Feature Access V2 canonical count' || exit 0
          git push origin main
