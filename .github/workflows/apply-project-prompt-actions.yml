name: Apply project prompt actions patch

on:
  push:
    branches:
      - feat/project-prompt-rehome-actions

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/project-prompt-rehome-actions
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: python3 scripts/apply_project_prompt_actions_patch.py
      - run: rm scripts/apply_project_prompt_actions_patch.py .github/workflows/apply-project-prompt-actions.yml
      - run: bunx prettier --write src/lib/ai.functions.ts src/routes/library.tsx src/components/promptbeats/ProjectPromptActionMenu.tsx src/lib/project-version-history.test.ts
      - run: bun test src/lib/project-version-history.test.ts
      - run: bun run lint
      - run: bun run build
      - run: bunx tsc --noEmit --pretty false
      - name: Commit patch
        run: |
          git config user.name "PromptBeats Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Add Project prompt detach copy and move actions"
          git push origin HEAD:feat/project-prompt-rehome-actions
