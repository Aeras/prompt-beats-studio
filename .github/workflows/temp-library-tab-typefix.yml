name: Temporary Library tab type fix

on:
  push:
    branches:
      - fix/library-tab-persistence-mobile-nav

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/library-tab-persistence-mobile-nav
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Patch optional Library search typing
        run: |
          python .github/scripts/library_tab_typefix.py
          bunx prettier --write src/routes/library.tsx src/lib/library-folders.test.ts
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/library.tsx src/lib/library-folders.test.ts
          git commit -m "Make Library tab search optional"
          git push origin HEAD:fix/library-tab-persistence-mobile-nav
