name: AI Tools default architecture

on:
  push:
    branches: [ai-tools-default-architecture]

permissions:
  contents: write

jobs:
  implement:
    if: github.event.head_commit.message != 'Implement AI Tools default architecture'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ai-tools-default-architecture
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Apply architecture patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=None):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'missing pattern in {path}: {old[:120]!r}')
              s = s.replace(old, new, count if count is not None else -1)
              p.write_text(s)

          # Central registry: third operation/default category. AI Tools reuse the
          # generator-compatible text/tool capability contract until dedicated
          # per-capability flags are introduced; multimodal tools still apply their
          # stricter provider/capability filter on top.
          replace('src/lib/ai-model-registry.server.ts',
              'export type AiModelOperation = "generator" | "quality_check";',
              'export type AiModelOperation = "generator" | "quality_check" | "ai_tools";')
          replace('src/lib/ai-model-registry.server.ts',
              '  if (operation === "generator") {\n    return model.generatorCompatible && model.generatorEnabled;\n  }\n  return model.qualityCheckCompatible && model.qualityCheckEnabled;',
              '  if (operation === "quality_check") {\n    return model.qualityCheckCompatible && model.qualityCheckEnabled;\n  }\n  return model.generatorCompatible && model.generatorEnabled;')
          replace('src/lib/ai-model-registry.server.ts',
              '  const value =\n    operation === "generator" ? model.generatorReasoningEffort : model.qualityCheckReasoningEffort;',
              '  const value =\n    operation === "quality_check"\n      ? model.qualityCheckReasoningEffort\n      : model.generatorReasoningEffort;')
          replace('src/lib/ai-model-registry.server.ts',
              'const settingKeyFor = (operation: AiModelOperation) =>\n  operation === "generator" ? "ai_generator_default_model" : "ai_quality_check_default_model";',
              'const settingKeyFor = (operation: AiModelOperation) => {\n  if (operation === "generator") return "ai_generator_default_model";\n  if (operation === "quality_check") return "ai_quality_check_default_model";\n  return "ai_tools_default_model";\n};')

          # Legacy shared write path keeps all three defaults aligned when it is used.
          replace('src/lib/ai-provider.server.ts',
              'for (const key of ["ai_model", "ai_generator_default_model", "ai_quality_check_default_model"]) {',
              'for (const key of [\n    "ai_model",\n    "ai_generator_default_model",\n    "ai_quality_check_default_model",\n    "ai_tools_default_model",\n  ]) {')

          # Admin server: expose, protect and write the third default.
          replace('src/lib/ai-model-admin.functions.ts',
              'const [{ data: rows, error }, generatorDefault, qualityDefault] = await Promise.all([',
              'const [{ data: rows, error }, generatorDefault, qualityDefault, aiToolsDefault] = await Promise.all([')
          replace('src/lib/ai-model-admin.functions.ts',
              '      readDefaultModel(supabaseAdmin, "ai_quality_check_default_model"),\n    ]);',
              '      readDefaultModel(supabaseAdmin, "ai_quality_check_default_model"),\n      readDefaultModel(supabaseAdmin, "ai_tools_default_model"),\n    ]);', 1)
          replace('src/lib/ai-model-admin.functions.ts',
              '      qualityDefault,\n    };',
              '      qualityDefault,\n      aiToolsDefault,\n    };', 1)
          replace('src/lib/ai-model-admin.functions.ts',
              'const [generatorDefault, qualityDefault] = await Promise.all([\n      readDefaultModel(supabaseAdmin, "ai_generator_default_model"),\n      readDefaultModel(supabaseAdmin, "ai_quality_check_default_model"),\n    ]);',
              'const [generatorDefault, qualityDefault, aiToolsDefault] = await Promise.all([\n      readDefaultModel(supabaseAdmin, "ai_generator_default_model"),\n      readDefaultModel(supabaseAdmin, "ai_quality_check_default_model"),\n      readDefaultModel(supabaseAdmin, "ai_tools_default_model"),\n    ]);')
          replace('src/lib/ai-model-admin.functions.ts',
              '    const isGeneratorDefault = row.provider_model_id === generatorDefault;\n    const isQualityDefault = row.provider_model_id === qualityDefault;',
              '    const isGeneratorDefault = row.provider_model_id === generatorDefault;\n    const isQualityDefault = row.provider_model_id === qualityDefault;\n    const isAiToolsDefault = row.provider_model_id === aiToolsDefault;')
          replace('src/lib/ai-model-admin.functions.ts',
              '      isGeneratorDefault &&\n      (data.status !== "enabled" || !data.generatorEnabled || !row.generator_compatible);',
              '      (isGeneratorDefault || isAiToolsDefault) &&\n      (data.status !== "enabled" || !data.generatorEnabled || !row.generator_compatible);')
          replace('src/lib/ai-model-admin.functions.ts',
              '      (isGeneratorDefault || isQualityDefault) && data.accessPolicy !== "all_users";',
              '      (isGeneratorDefault || isQualityDefault || isAiToolsDefault) &&\n      data.accessPolicy !== "all_users";')
          replace('src/lib/ai-model-admin.functions.ts',
              '    if (disablingGenerator)\n      throw new Error("Select another Generator default before disabling this model.");',
              '    if (disablingGenerator)\n      throw new Error(\n        isAiToolsDefault && !isGeneratorDefault\n          ? "Select another AI Tools default before disabling this model."\n          : "Select another Generator default before disabling this model.",\n      );')
          replace('src/lib/ai-model-admin.functions.ts',
              '      const usedBy =\n        isGeneratorDefault && isQualityDefault\n          ? "Generator and Quality Check"\n          : isGeneratorDefault\n            ? "Generator"\n            : "Quality Check";',
              '      const usedBy = [\n        isGeneratorDefault ? "Generator" : null,\n        isQualityDefault ? "Quality Check" : null,\n        isAiToolsDefault ? "AI Tools" : null,\n      ]\n        .filter(Boolean)\n        .join(", ");')
          replace('src/lib/ai-model-admin.functions.ts',
              '  operation: z.enum(["generator", "quality_check"]),',
              '  operation: z.enum(["generator", "quality_check", "ai_tools"]),')
          replace('src/lib/ai-model-admin.functions.ts',
              '    const valid =\n      data.operation === "generator"\n        ? model.status === "enabled" &&\n          model.generator_compatible === true &&\n          model.generator_enabled === true\n        : model.status === "enabled" &&\n          model.quality_check_compatible === true &&\n          model.quality_check_enabled === true;',
              '    const valid =\n      data.operation === "quality_check"\n        ? model.status === "enabled" &&\n          model.quality_check_compatible === true &&\n          model.quality_check_enabled === true\n        : model.status === "enabled" &&\n          model.generator_compatible === true &&\n          model.generator_enabled === true;')
          replace('src/lib/ai-model-admin.functions.ts',
              '    const key =\n      data.operation === "generator"\n        ? "ai_generator_default_model"\n        : "ai_quality_check_default_model";',
              '    const key =\n      data.operation === "generator"\n        ? "ai_generator_default_model"\n        : data.operation === "quality_check"\n          ? "ai_quality_check_default_model"\n          : "ai_tools_default_model";')

          # Admin UI: third default selector. AI Tools currently uses the same
          # compatibility surface as generator-capable text models.
          replace('src/components/promptbeats/AiModelsPanel.tsx',
              '  qualityDefault,\n  onClose,',
              '  qualityDefault,\n  aiToolsDefault,\n  onClose,', 1)
          replace('src/components/promptbeats/AiModelsPanel.tsx',
              '  qualityDefault: string | null;\n  onClose: () => void;',
              '  qualityDefault: string | null;\n  aiToolsDefault: string | null;\n  onClose: () => void;', 1)
          replace('src/components/promptbeats/AiModelsPanel.tsx',
              '  const isQualityDefault = qualityDefault === model.providerModelId;\n  const isDefaultModel = isGeneratorDefault || isQualityDefault;',
              '  const isQualityDefault = qualityDefault === model.providerModelId;\n  const isAiToolsDefault = aiToolsDefault === model.providerModelId;\n  const isDefaultModel = isGeneratorDefault || isQualityDefault || isAiToolsDefault;')
          replace('src/components/promptbeats/AiModelsPanel.tsx',
              '    (isQualityDefault && (!qualityEnabled || status !== "enabled")) ||',
              '    (isQualityDefault && (!qualityEnabled || status !== "enabled")) ||\n    (isAiToolsDefault && (!generatorEnabled || status !== "enabled")) ||')
          replace('src/components/promptbeats/AiModelsPanel.tsx',
              '    isGeneratorDefault && isQualityDefault\n      ? t("aiModels.defaultAccessProtectionBoth")\n      : isGeneratorDefault\n        ? t("aiModels.defaultAccessProtectionGenerator")\n        : t("aiModels.defaultAccessProtectionQuality");',
              '    isAiToolsDefault\n      ? t("aiModels.defaultAccessProtectionAiTools")\n      : isGeneratorDefault && isQualityDefault\n        ? t("aiModels.defaultAccessProtectionBoth")\n        : isGeneratorDefault\n          ? t("aiModels.defaultAccessProtectionGenerator")\n          : t("aiModels.defaultAccessProtectionQuality");')
          replace('src/components/promptbeats/AiModelsPanel.tsx',
              '  const [qualityDefault, setQualityDefault] = useState("");',
              '  const [qualityDefault, setQualityDefault] = useState("");\n  const [aiToolsDefault, setAiToolsDefault] = useState("");')
          replace('src/components/promptbeats/AiModelsPanel.tsx',
              '    setQualityDefault(data.qualityDefault ?? "");',
              '    setQualityDefault(data.qualityDefault ?? "");\n    setAiToolsDefault(data.aiToolsDefault ?? "");')
          replace('src/components/promptbeats/AiModelsPanel.tsx',
              '    mutationFn: (input: { operation: "generator" | "quality_check"; model: string }) =>',
              '    mutationFn: (input: {\n      operation: "generator" | "quality_check" | "ai_tools";\n      model: string;\n    }) =>')
          replace('src/components/promptbeats/AiModelsPanel.tsx',
              '  const qualityOptions = useMemo(',
              '  const aiToolsOptions = generatorOptions;\n  const qualityOptions = useMemo(', 1)
          replace('src/components/promptbeats/AiModelsPanel.tsx',
              '<div className="grid gap-3 lg:grid-cols-2">',
              '<div className="grid gap-3 lg:grid-cols-3">', 1)
          marker = '''        <div className="glass rounded-2xl p-4">\n          <div className="flex items-center gap-2 text-sm font-semibold">\n            <ShieldCheck className="h-4 w-4 text-primary" />\n            {t("aiModels.qualityDefault")}'''
          p = Path('src/components/promptbeats/AiModelsPanel.tsx')
          s = p.read_text()
          idx = s.find(marker)
          if idx < 0:
              raise SystemExit('missing quality default card marker')
          # Insert AI Tools card just before Quality Check card.
          card = '''        <div className="glass rounded-2xl p-4">\n          <div className="flex items-center gap-2 text-sm font-semibold">\n            <Cpu className="h-4 w-4 text-primary" />\n            {t("aiModels.aiToolsDefault")}\n          </div>\n          <div className="mt-3 flex gap-2">\n            <select\n              value={aiToolsDefault}\n              onChange={(e) => setAiToolsDefault(e.target.value)}\n              className="min-w-0 flex-1 rounded-xl border border-white/10 bg-[#17131f] px-3 py-2 text-sm"\n            >\n              {aiToolsOptions.map((m) => (\n                <option key={m.id} value={m.providerModelId}>\n                  {m.displayName}\n                </option>\n              ))}\n            </select>\n            <button\n              disabled={!aiToolsDefault || setDefault.isPending}\n              onClick={() => setDefault.mutate({ operation: "ai_tools", model: aiToolsDefault })}\n              className="rounded-xl bg-primary px-3 py-2 text-xs font-semibold text-primary-foreground disabled:opacity-50"\n            >\n              {t("aiModels.saveDefault")}\n            </button>\n          </div>\n        </div>\n'''
          s = s[:idx] + card + s[idx:]
          # Editor invocation.
          old = '            qualityDefault={data.qualityDefault}\n            onClose={() => setEditing(null)}'
          if old not in s:
              raise SystemExit('missing editor invocation')
          s = s.replace(old, '            qualityDefault={data.qualityDefault}\n            aiToolsDefault={data.aiToolsDefault}\n            onClose={() => setEditing(null)}', 1)
          p.write_text(s)

          # Translations.
          replace('src/i18n/locales/en-ai-models.ts',
              '  "aiModels.qualityDefault": "Quality Check default",',
              '  "aiModels.qualityDefault": "Quality Check default",\n  "aiModels.aiToolsDefault": "AI Tools default",')
          replace('src/i18n/locales/en-ai-models.ts',
              '  "aiModels.defaultAccessProtectionQuality":',
              '  "aiModels.defaultAccessProtectionAiTools":\n    "This model is the AI Tools default. Choose another default before restricting its access.",\n  "aiModels.defaultAccessProtectionQuality":', 1)
          replace('src/i18n/locales/el-ai-models.ts',
              '  "aiModels.qualityDefault": "Προεπιλογή Quality Check",',
              '  "aiModels.qualityDefault": "Προεπιλογή Quality Check",\n  "aiModels.aiToolsDefault": "Προεπιλογή AI Tools",')
          replace('src/i18n/locales/el-ai-models.ts',
              '  "aiModels.defaultAccessProtectionQuality":',
              '  "aiModels.defaultAccessProtectionAiTools":\n    "Αυτό το μοντέλο είναι η προεπιλογή AI Tools. Επίλεξε άλλη προεπιλογή πριν περιορίσεις την πρόσβασή του.",\n  "aiModels.defaultAccessProtectionQuality":', 1)

          # Public model access endpoint exposes the third bucket for tool UIs.
          p = Path('src/lib/ai.functions.ts')
          s = p.read_text()
          old = '''    const [generatorResult, qualityResult] = await Promise.allSettled([\n      getEffectiveModelAccess(context.userId, "generator"),\n      getEffectiveModelAccess(context.userId, "quality_check"),\n    ]);'''
          new = '''    const [generatorResult, qualityResult, aiToolsResult] = await Promise.allSettled([\n      getEffectiveModelAccess(context.userId, "generator"),\n      getEffectiveModelAccess(context.userId, "quality_check"),\n      getEffectiveModelAccess(context.userId, "ai_tools"),\n    ]);'''
          if old not in s: raise SystemExit('missing model access allSettled block')
          s = s.replace(old, new, 1)
          old = '''      qualityCheck: qualityResult.status === "fulfilled" ? qualityResult.value : emptyAccess(),\n    };'''
          new = '''      qualityCheck: qualityResult.status === "fulfilled" ? qualityResult.value : emptyAccess(),\n      aiTools: aiToolsResult.status === "fulfilled" ? aiToolsResult.value : emptyAccess(),\n    };'''
          if old not in s: raise SystemExit('missing model access return block')
          s = s.replace(old, new, 1)
          p.write_text(s)

          # Story Map + Inspiration Wall now resolve through AI Tools.
          p = Path('src/lib/story-map-ai.functions.ts')
          s = p.read_text()
          s = s.replace('  // Story Map is registry-backed now. The dedicated AI Tools default is added in\n  // the agreed model-architecture step; until then this resolves through the\n  // existing generator-compatible registry without hard-coding a provider/model.\n  const access = await getEffectiveModelAccess(userId, "generator");',
                        '  const access = await getEffectiveModelAccess(userId, "ai_tools");')
          p.write_text(s)
          replace('src/lib/inspiration-wall-ai.functions.ts',
              'getEffectiveModelAccess(userId, "generator")',
              'getEffectiveModelAccess(userId, "ai_tools")')

          # Song Setup Assistant: remove the hidden hard-coded model and resolve
          # user-selected/default AI Tools model server-authoritatively.
          p = Path('src/lib/song-setup-assistant.functions.ts')
          s = p.read_text()
          s = s.replace('export const SONG_SETUP_ASSISTANT_MODEL = "gemini-3.8-flash" as const;\n\n', '')
          s = s.replace('  targetPlatform: z.enum([...AI_TARGET_PLATFORMS] as [AITargetPlatform, ...AITargetPlatform[]]),\n});',
                        '  targetPlatform: z.enum([...AI_TARGET_PLATFORMS] as [AITargetPlatform, ...AITargetPlatform[]]),\n  model: z.string().trim().min(1).max(240).optional(),\n});')
          old = '''    const { modelCaller, providerOf } = await import("@/lib/ai-provider.server");\n    const { recordAiUsage } = await import("@/lib/ai-usage.server");\n    const caller = modelCaller(SONG_SETUP_ASSISTANT_MODEL);\n    const provider = providerOf(SONG_SETUP_ASSISTANT_MODEL);'''
          new = '''    const { modelCaller, resolveAiModelForUser } = await import("@/lib/ai-provider.server");\n    const { recordAiUsage } = await import("@/lib/ai-usage.server");\n    const resolved = await resolveAiModelForUser(context.userId, "ai_tools", data.model);\n    const caller = modelCaller(resolved.model, resolved.provider);\n    const provider = resolved.provider;'''
          if old not in s: raise SystemExit('missing setup model block')
          s = s.replace(old, new, 1)
          s = s.replace('      return { setup, model: SONG_SETUP_ASSISTANT_MODEL };',
                        '      return { setup, model: result.model };')
          s = s.replace('          model: SONG_SETUP_ASSISTANT_MODEL,',
                        '          model: resolved.model,')
          p.write_text(s)

          # Tests that intentionally inspect architecture.
          replace('src/lib/inspiration-wall-phase3.test.ts',
              'getEffectiveModelAccess(userId, "generator")',
              'getEffectiveModelAccess(userId, "ai_tools")')
          p = Path('src/lib/audit-hardening-20260922.test.ts')
          s = p.read_text()
          s = s.replace('setup.indexOf("modelCaller(SONG_SETUP_ASSISTANT_MODEL)")',
                        'setup.indexOf("resolveAiModelForUser(context.userId, \\\"ai_tools\\\", data.model)")')
          p.write_text(s)

          # Permanent migration seed for the third default, copying current
          # Generator default when no explicit AI Tools value exists yet.
          Path('supabase/migrations/20260923222500_ai_tools_default_model.sql').write_text('''-- Add the third canonical AI default category: AI Tools.\n-- Existing installations inherit the current Generator default once, then\n-- Admin may manage the AI Tools default independently.\nINSERT INTO public.app_settings(key, value, updated_at, updated_by)\nSELECT\n  'ai_tools_default_model',\n  COALESCE(\n    (SELECT value FROM public.app_settings WHERE key = 'ai_generator_default_model'),\n    (SELECT value FROM public.app_settings WHERE key = 'ai_model'),\n    '{"model":"gemini-3.8-flash"}'::jsonb\n  ),\n  now(),\n  NULL\nWHERE NOT EXISTS (\n  SELECT 1 FROM public.app_settings WHERE key = 'ai_tools_default_model'\n);\n''')

          # Dedicated regression coverage for the architecture decision.
          Path('src/lib/ai-tools-default-architecture.test.ts').write_text('''import { describe, expect, test } from "bun:test";\n\nasync function source(path: string) { return Bun.file(path).text(); }\n\ndescribe("AI Tools default architecture", () => {\n  test("registry exposes exactly the three canonical operation buckets", async () => {\n    const registry = await source("src/lib/ai-model-registry.server.ts");\n    expect(registry).toContain('"generator" | "quality_check" | "ai_tools"');\n    expect(registry).toContain('return "ai_tools_default_model"');\n  });\n\n  test("Admin surface reads and writes the AI Tools default", async () => {\n    const admin = await source("src/lib/ai-model-admin.functions.ts");\n    const panel = await source("src/components/promptbeats/AiModelsPanel.tsx");\n    expect(admin).toContain('readDefaultModel(supabaseAdmin, "ai_tools_default_model")');\n    expect(admin).toContain('z.enum(["generator", "quality_check", "ai_tools"])');\n    expect(panel).toContain('t("aiModels.aiToolsDefault")');\n    expect(panel).toContain('operation: "ai_tools"');\n  });\n\n  test("standalone tools resolve through AI Tools while Story-driven generation remains Generator-owned", async () => {\n    const story = await source("src/lib/story-map-ai.functions.ts");\n    const wall = await source("src/lib/inspiration-wall-ai.functions.ts");\n    const setup = await source("src/lib/song-setup-assistant.functions.ts");\n    const generator = await source("src/lib/generation-jobs.functions.ts");\n    expect(story).toContain('getEffectiveModelAccess(userId, "ai_tools")');\n    expect(wall).toContain('getEffectiveModelAccess(userId, "ai_tools")');\n    expect(setup).toContain('resolveAiModelForUser(context.userId, "ai_tools", data.model)');\n    expect(setup).not.toContain('SONG_SETUP_ASSISTANT_MODEL');\n    expect(generator).toContain('getModelForUser(context.userId, data.generationModel ?? undefined, "generator")');\n  });\n\n  test("public access payload exposes AI Tools options for conditional selectors", async () => {\n    const ai = await source("src/lib/ai.functions.ts");\n    expect(ai).toContain('getEffectiveModelAccess(context.userId, "ai_tools")');\n    expect(ai).toContain('aiTools: aiToolsResult.status === "fulfilled"');\n  });\n});\n''')

          # Permanent gate includes the new architecture tests.
          p = Path('.github/workflows/regression-gate.yml')
          s = p.read_text()
          anchor = '      - name: Song Universe tests\n        run: bun test src/lib/song-universe.test.ts\n'
          if anchor not in s: raise SystemExit('missing regression gate anchor')
          s = s.replace(anchor, anchor + '\n      - name: AI Tools default architecture tests\n        run: bun test src/lib/ai-tools-default-architecture.test.ts\n', 1)
          p.write_text(s)
          PY
          bunx prettier --write src/lib/ai-model-registry.server.ts src/lib/ai-provider.server.ts src/lib/ai-model-admin.functions.ts src/components/promptbeats/AiModelsPanel.tsx src/i18n/locales/en-ai-models.ts src/i18n/locales/el-ai-models.ts src/lib/ai.functions.ts src/lib/story-map-ai.functions.ts src/lib/inspiration-wall-ai.functions.ts src/lib/song-setup-assistant.functions.ts src/lib/inspiration-wall-phase3.test.ts src/lib/audit-hardening-20260922.test.ts src/lib/ai-tools-default-architecture.test.ts .github/workflows/regression-gate.yml
      - name: Validate targeted tests
        run: |
          bun test src/lib/ai-tools-default-architecture.test.ts
          bun test src/lib/story-map.test.ts src/lib/inspiration-wall-phase3.test.ts src/lib/audit-hardening-20260922.test.ts
          bun run lint
          bun run build
          bunx tsc --noEmit --pretty false
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .
          git commit -m 'Implement AI Tools default architecture' || exit 0
          git push origin ai-tools-default-architecture
