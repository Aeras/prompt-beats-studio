name: Inspiration Wall Fonts

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/inspiration-wall-phase2-polish.yml

permissions:
  contents: write

jobs:
  fonts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Fetch official font assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/fonts/inspiration-wall/pecita
          mkdir -p public/fonts/inspiration-wall/caveat
          curl -fL https://raw.githubusercontent.com/googlefonts/pecita/main/fonts/Pecita.otf -o public/fonts/inspiration-wall/pecita/Pecita.otf
          curl -fL https://raw.githubusercontent.com/googlefonts/pecita/main/OFL.txt -o public/fonts/inspiration-wall/pecita/OFL.txt
          curl -fL 'https://raw.githubusercontent.com/googlefonts/caveat/main/fonts/variable/Caveat%5Bwght%5D.ttf' -o 'public/fonts/inspiration-wall/caveat/Caveat[wght].ttf'
          curl -fL https://raw.githubusercontent.com/googlefonts/caveat/main/OFL.txt -o public/fonts/inspiration-wall/caveat/OFL.txt
          test -s public/fonts/inspiration-wall/pecita/Pecita.otf
          test -s 'public/fonts/inspiration-wall/caveat/Caveat[wght].ttf'
          grep -q 'SIL OPEN FONT LICENSE Version 1.1' public/fonts/inspiration-wall/pecita/OFL.txt
          grep -q 'SIL OPEN FONT LICENSE Version 1.1' public/fonts/inspiration-wall/caveat/OFL.txt
      - name: Commit font assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/fonts/inspiration-wall
          git commit -m "Add Inspiration Wall artistic fonts and licenses"
          git push origin HEAD:main
