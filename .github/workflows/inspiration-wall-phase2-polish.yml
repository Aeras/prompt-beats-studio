name: Inspiration Wall Phase 2 Polish

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/inspiration-wall-phase2-polish.yml

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Apply Phase 2 polish
        run: python3 scripts/inspiration-wall-phase2-polish.py
      - name: Format
        run: bunx prettier --write src/styles.css src/routes/inspiration-wall.tsx src/lib/inspiration-wall-phase2.test.ts
      - name: Phase 2 tests
        run: bun test src/lib/inspiration-wall.test.ts src/lib/inspiration-wall-phase2.test.ts src/lib/feature-access-v2.test.ts
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build
      - name: Strict TypeScript
        run: bunx tsc --noEmit --pretty false
      - name: Commit polish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/styles.css src/routes/inspiration-wall.tsx src/lib/inspiration-wall-phase2.test.ts
          git commit -m "Polish Inspiration Wall Phase 2 workspace"
          git push origin HEAD:main
