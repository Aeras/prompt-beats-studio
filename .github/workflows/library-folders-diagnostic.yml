name: Library Folders Diagnostic

on:
  push:
    branches: [main]

jobs:
  library-folders:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Library Folders tests
        shell: bash
        run: |
          set +e
          bun test src/lib/library-folders.test.ts > /tmp/library-folders.log 2>&1
          code=$?
          echo "=== LIBRARY FOLDERS FAILURE SUMMARY ==="
          grep -E -A10 -B6 'FAIL|fail|error|Error|expect|Expected|Received' /tmp/library-folders.log | tail -n 100 || true
          echo "=== END SUMMARY ==="
          exit $code
