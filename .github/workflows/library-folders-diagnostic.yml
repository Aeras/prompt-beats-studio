name: Library Folders Diagnostic

on:
  push:
    branches: [main]

jobs:
  library-folders:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Library Folders tests
        run: bun test src/lib/library-folders.test.ts
