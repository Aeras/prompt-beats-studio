name: Library Folders Diagnostic

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  library-folders:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.22
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Make source checks formatting-robust
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/lib/library-folders.test.ts')
          text = path.read_text()
          replacements = {
              '''    expect(library).toContain(\n      'view !== \"analyses\" && <button disabled={busy} onClick={createFolder}',\n    );''': '''    expect(library).toMatch(\n      /view !== \"analyses\" && \\(\\s*<button\\s+disabled=\\{busy\\}\\s+onClick=\\{createFolder\\}/,\n    );''',
              '''    expect(library).toContain(\"setOpenProjectId(null); onViewChange(item);\");''': '''    expect(library).toMatch(\n      /setOpenProjectId\\(null\\);\\s*onViewChange\\(item\\);/,\n    );''',
              '''    expect(library).toContain(\n      'disabledDestinationFolderId={folderPicker?.operation === \"move\" ? folderPicker.currentFolderId : undefined}',\n    );''': '''    expect(library).toMatch(\n      /disabledDestinationFolderId=\\{\\s*folderPicker\\?\\.operation === \"move\"\\s*\\?\\s*folderPicker\\.currentFolderId\\s*:\\s*undefined\\s*\\}/,\n    );''',
              '''    expect(library).toContain(\"document.elementFromPoint\");''': '''    expect(library).toMatch(/document\\s*\\.\\s*elementFromPoint/);''',
          }
          changed = False
          for old, new in replacements.items():
              if old not in text:
                  print('Pattern already changed or not found:', old.splitlines()[0])
                  continue
              text = text.replace(old, new, 1)
              changed = True
          if changed:
              path.write_text(text)
          PY
      - name: Library Folders tests
        run: bun test src/lib/library-folders.test.ts
      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet -- src/lib/library-folders.test.ts; then
            echo "No test changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/library-folders.test.ts
          git commit -m "Make Library Folders source checks formatting-robust"
          git push origin HEAD:main
