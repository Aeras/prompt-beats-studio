name: Temporary format generator guidance

on:
  push:
    branches:
      - fix/generator-required-field-guidance

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'Format generator required-field guidance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/generator-required-field-guidance
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx prettier --write src/routes/generate.tsx
      - run: |
          git config user.name "PromptBeats CI"
          git config user.email "actions@users.noreply.github.com"
          git add src/routes/generate.tsx
          git diff --cached --check
          git commit -m "Format generator required-field guidance"
          git push origin HEAD:fix/generator-required-field-guidance
