name: One-shot public track read fix

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch public track listing
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/lib/tracks.functions.ts")
          text = path.read_text()
          old = '''export const listPublishedTracks = createServerFn({ method: "GET" }).handler(async () => {
            const { createPublicServerClient } = await import("@/lib/supabase-public.server");
            const { supabaseAdmin } = await import("@/integrations/supabase/client.server");
            const supabase = createPublicServerClient();
            const { data, error } = await (supabaseAdmin.from("tracks") as any)
          '''
          new = '''export const listPublishedTracks = createServerFn({ method: "GET" }).handler(async () => {
            const { createPublicServerClient } = await import("@/lib/supabase-public.server");
            const supabase = createPublicServerClient();
            const { data, error } = await (supabase.from("tracks") as any)
          '''
          if old not in text:
              raise SystemExit("Expected listPublishedTracks block not found")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit fix
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "Aeras"
          git config user.email "4737202+Aeras@users.noreply.github.com"
          git add src/lib/tracks.functions.ts
          git commit -m "Use public Supabase client for published tracks"
          git push origin main
