name: Moderation Cases Diagnostic

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-moderation-cases-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Make RPC wrapper check formatting-robust
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/lib/moderation-cases.test.ts')
          text = path.read_text()
          old = '      expect(fns).toContain(`rpc("${rpc}"`);'
          new = '      expect(fns).toMatch(new RegExp(`rpc\\\\(\\\\s*"${rpc}"`));'
          if old not in text:
              raise SystemExit('Expected Moderation Cases RPC assertion not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Moderation Cases tests
        run: bun test src/lib/moderation-cases.test.ts
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/moderation-cases.test.ts
          git commit -m "Make Moderation Cases RPC test formatting-robust"
          git push origin HEAD:main
