name: Inspiration Wall Phase 3 Integrate

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspiration-wall-phase3-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Integrate Phase 3 UI and gate
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          route = Path('src/routes/inspiration-wall.tsx')
          s = route.read_text()

          import_anchor = 'import { AppShell } from "@/components/promptbeats/AppShell";\n'
          panel_import = 'import { InspirationWallDirectionPanel } from "@/components/promptbeats/InspirationWallDirectionPanel";\n'
          if panel_import not in s:
              assert import_anchor in s
              s = s.replace(import_anchor, import_anchor + panel_import)

          old = '''              <WallWorkspace
                wall={wall.data.wall}
                cards={wall.data.cards}
                language={language}
                userId={user!.id}
                onRefresh={() => refresh(selectedWallId)}
                onDeleteWall={removeWall}
              />'''
          new = '''              <WallWorkspace
                wall={wall.data.wall}
                cards={wall.data.cards}
                trackLinks={wall.data.trackLinks}
                language={language}
                userId={user!.id}
                onRefresh={() => refresh(selectedWallId)}
                onDeleteWall={removeWall}
              />'''
          assert old in s
          s = s.replace(old, new)

          old = '''function WallWorkspace({
  wall,
  cards,
  language,
  userId,
  onRefresh,
  onDeleteWall,
}: {
  wall: Awaited<ReturnType<typeof getInspirationWall>>["wall"];
  cards: InspirationWallCardRecord[];
  language: "en" | "el";
  userId: string;
  onRefresh: () => Promise<void>;
  onDeleteWall: () => Promise<void>;
}) {'''
          new = '''function WallWorkspace({
  wall,
  cards,
  trackLinks,
  language,
  userId,
  onRefresh,
  onDeleteWall,
}: {
  wall: Awaited<ReturnType<typeof getInspirationWall>>["wall"];
  cards: InspirationWallCardRecord[];
  trackLinks: Awaited<ReturnType<typeof getInspirationWall>>["trackLinks"];
  language: "en" | "el";
  userId: string;
  onRefresh: () => Promise<void>;
  onDeleteWall: () => Promise<void>;
}) {'''
          assert old in s
          s = s.replace(old, new)

          marker = '''      <div
        className={cn(
          "relative min-h-[68vh] rounded-3xl border border-white/10 p-4 sm:p-6",'''
          insert = '''      <InspirationWallDirectionPanel
        wall={wall}
        trackLinks={trackLinks}
        language={language}
        onRefresh={onRefresh}
      />

'''
          assert marker in s
          s = s.replace(marker, insert + marker, 1)
          route.write_text(s)

          gate = Path('.github/workflows/regression-gate.yml')
          g = gate.read_text()
          old = '''      - name: Inspiration Wall Phase 2 tests
        run: bun test src/lib/inspiration-wall-phase2.test.ts

      - name: Smart Presets and language catalog tests'''
          new = '''      - name: Inspiration Wall Phase 2 tests
        run: bun test src/lib/inspiration-wall-phase2.test.ts

      - name: Inspiration Wall Phase 3 tests
        run: bun test src/lib/inspiration-wall-phase3.test.ts

      - name: Smart Presets and language catalog tests'''
          assert old in g
          g = g.replace(old, new)
          gate.write_text(g)
          PY
          bunx prettier --write src/routes/inspiration-wall.tsx src/components/promptbeats/InspirationWallDirectionPanel.tsx src/lib/inspiration-wall-ai.functions.ts src/lib/inspiration-wall-phase3.test.ts .github/workflows/regression-gate.yml
      - name: Inspiration Wall tests
        run: bun test src/lib/inspiration-wall.test.ts src/lib/inspiration-wall-phase2.test.ts src/lib/inspiration-wall-phase3.test.ts src/lib/feature-access-v2.test.ts
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build
      - name: Strict TypeScript
        run: bunx tsc --noEmit --pretty false
      - name: Commit Phase 3
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/inspiration-wall.tsx src/components/promptbeats/InspirationWallDirectionPanel.tsx src/lib/inspiration-wall-ai.functions.ts src/lib/inspiration-wall-phase3.test.ts .github/workflows/regression-gate.yml
          if git diff --cached --quiet; then
            echo "No Phase 3 changes required."
            exit 0
          fi
          git commit -m "Add Inspiration Wall Phase 3 AI and connections"
          git push origin HEAD:main
