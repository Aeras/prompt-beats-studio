name: Inspiration Wall Phase 3 Integrate

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspiration-wall-phase3-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Integrate Phase 3 UI and gate
        run: python3 scripts/inspiration-wall-phase3-integrate.py
      - name: Format
        run: bunx prettier --write src/routes/inspiration-wall.tsx src/components/promptbeats/InspirationWallDirectionPanel.tsx src/lib/inspiration-wall-ai.functions.ts src/lib/inspiration-wall-phase3.test.ts .github/workflows/regression-gate.yml
      - name: Inspiration Wall tests
        run: bun test src/lib/inspiration-wall.test.ts src/lib/inspiration-wall-phase2.test.ts src/lib/inspiration-wall-phase3.test.ts src/lib/feature-access-v2.test.ts
      - name: Lint
        run: bun run lint
      - name: Build
        run: bun run build
      - name: Strict TypeScript
        run: bunx tsc --noEmit --pretty false
      - name: Commit Phase 3
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routes/inspiration-wall.tsx src/components/promptbeats/InspirationWallDirectionPanel.tsx src/lib/inspiration-wall-ai.functions.ts src/lib/inspiration-wall-phase3.test.ts .github/workflows/regression-gate.yml
          if git diff --cached --quiet; then
            echo "No Phase 3 changes required."
            exit 0
          fi
          git commit -m "Add Inspiration Wall Phase 3 AI and connections"
          git push origin HEAD:main
